steps:
  # 1. Build Docker container image trên Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/spx-hub-portal:latest', '.']

  # 2. Push image lên Container Registry của dự án
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/spx-hub-portal:latest']

  # 3. Deploy lên Google Cloud Run tại vùng Đông Nam Á (Singapore)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'spx-hub-portal'
      - '--image'
      - 'gcr.io/$PROJECT_ID/spx-hub-portal:latest'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '20'

images:
  - 'gcr.io/$PROJECT_ID/spx-hub-portal:latest'
