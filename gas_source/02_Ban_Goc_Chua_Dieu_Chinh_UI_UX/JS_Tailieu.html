<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ═══════════════════════════════════════════
   RESET & ROOT — đồng bộ Index V19.0 MASTER
═══════════════════════════════════════════ */
#wk {
  all: initial;
  display: flex; flex-direction: column; height: 100%;
  font-family: 'Plus Jakarta Sans', sans-serif;
  overflow: hidden;
  /* Nền grid lưới mờ + radial gradient đặc trưng Index */
  background:
    radial-gradient(circle at 8% 4%, rgba(249,115,74,.13), transparent 28%),
    radial-gradient(circle at 92% 8%, rgba(56,163,199,.13), transparent 30%),
    linear-gradient(90deg, rgba(15,23,42,.035) 1px, transparent 1px),
    linear-gradient(180deg, rgba(15,23,42,.035) 1px, transparent 1px),
    linear-gradient(180deg, #f6f8fb, #eef4f8);
  background-size: auto, auto, 28px 28px, 28px 28px, auto;
  color: #172033;
  transition: background 0.3s ease, color 0.3s ease;
}
#wk * { box-sizing: border-box; margin: 0; padding: 0; font-family: inherit; }
#wk button, #wk input { font-family: inherit; }

/* ── CSS VARS ── */
#wk {
  --spx: #ee4d2d;
  --spx-soft: rgba(238,77,45,.11);
  --spx-glow: rgba(238,77,45,.22);
  --orange: #f9734a;
  --sky: #38a3c7;
  --green: #36b37e;
  --indigo: #7c83d6;
  --rose: #e85d75;
  --border: rgba(100,116,139,.16);
  --border2: rgba(100,116,139,.24);
  --surface: rgba(255,255,255,.88);
  --surface-solid: #ffffff;
  --surface2: rgba(248,250,252,.92);
  --text: #172033; --text2: #374151; --text3: #6b7a90; --text4: #9baac0;
  --shadow: 0 14px 40px rgba(31,41,55,.08);
  --shadow-soft: 0 8px 24px rgba(31,41,55,.06);
  --radius: 22px; --radius-md: 16px; --radius-sm: 12px; --radius-xs: 8px;
}

/* ── DARK MODE ── */
#wk.dark {
  background:
    radial-gradient(circle at 8% 4%, rgba(249,115,74,.14), transparent 30%),
    radial-gradient(circle at 92% 8%, rgba(56,163,199,.13), transparent 32%),
    linear-gradient(90deg, rgba(148,163,184,.07) 1px, transparent 1px),
    linear-gradient(180deg, rgba(148,163,184,.07) 1px, transparent 1px),
    linear-gradient(180deg, #0d1524, #081120);
  background-size: auto, auto, 30px 30px, 30px 30px, auto;
  color: #eef4fb;
  --border: rgba(148,163,184,.16);
  --border2: rgba(148,163,184,.26);
  --surface: rgba(20,31,49,.82);
  --surface-solid: #142033;
  --surface2: rgba(13,21,36,.88);
  --text: #eef4fb; --text2: #cbd5e1; --text3: #9baac0; --text4: #607388;
  --shadow: 0 18px 42px rgba(0,0,0,.24);
  --shadow-soft: 0 10px 28px rgba(0,0,0,.18);
}

/* ═══════════════════════════════════════════
   TOPBAR — đồng bộ .ops-nav của Index
═══════════════════════════════════════════ */
#wk .wk-nav {
  height: 74px; flex-shrink: 0;
  background:
    linear-gradient(90deg, rgba(255,255,255,.78), rgba(248,250,252,.72)),
    linear-gradient(90deg, rgba(238,77,45,.16), transparent 38%, rgba(56,163,199,.14));
  backdrop-filter: blur(22px) saturate(1.18);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 10px 34px rgba(31,41,55,.06);
  display: flex; align-items: center; gap: 14px;
  padding: 0 22px; position: relative; z-index: 50;
}
#wk.dark .wk-nav {
  background:
    linear-gradient(90deg, rgba(13,21,36,.82), rgba(15,23,42,.78)),
    linear-gradient(90deg, rgba(238,77,45,.18), transparent 40%, rgba(56,163,199,.14));
}

/* Brand */
#wk .wk-brand {
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; flex-shrink: 0;
}
#wk .wk-brand-mark {
  width: 44px; height: 44px; border-radius: 16px; flex-shrink: 0;
  background:
    linear-gradient(145deg, rgba(255,255,255,.22), transparent),
    linear-gradient(135deg, var(--orange), #ff9f6e);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px;
  box-shadow: 0 14px 28px rgba(249,115,74,.22);
  transition: transform .18s ease;
}
#wk .wk-brand:hover .wk-brand-mark { transform: scale(1.06); }
#wk .wk-brand-text { font-size: 17px; font-weight: 900; letter-spacing: -.3px; color: var(--text); transition: color .2s; }
#wk .wk-brand-text span { color: var(--spx); }
#wk .wk-brand-sub { font-size: 9px; font-weight: 800; color: var(--text4); text-transform: uppercase; letter-spacing: .1em; margin-top: 2px; transition: color .2s; }

/* Search */
#wk .wk-search-wrap {
  flex: 1; max-width: 480px; position: relative;
  height: 46px; border-radius: 18px;
  background: rgba(255,255,255,.82);
  border: 1px solid rgba(100,116,139,.14);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.86), 0 8px 22px rgba(31,41,55,.04);
  transition: border-color .2s, box-shadow .2s, background .2s;
}
#wk.dark .wk-search-wrap {
  background: rgba(20,31,49,.88); border-color: rgba(148,163,184,.16);
}
#wk .wk-search-wrap:focus-within {
  background: #fff; border-color: rgba(249,115,74,.42);
  box-shadow: 0 0 0 4px rgba(249,115,74,.10), 0 12px 26px rgba(31,41,55,.08);
}
#wk.dark .wk-search-wrap:focus-within { background: #17243a; }
#wk .wk-search-icon {
  position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
  color: var(--text4); font-size: 13px; transition: color .18s; pointer-events: none;
}
#wk .wk-search-wrap:focus-within .wk-search-icon { color: var(--orange); }
#wk .wk-search-input {
  width: 100%; height: 100%; border: none; background: transparent;
  padding: 0 14px 0 42px; outline: none;
  font-size: 13px; font-weight: 600; color: var(--text);
}
#wk .wk-search-input::placeholder { color: var(--text4); font-weight: 500; }

/* Nav right */
#wk .wk-nav-right { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-shrink: 0; }
#wk .wk-meta-pill {
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,.70); border: 1px solid var(--border);
  border-radius: 16px; padding: 6px 14px;
  font-size: 12px; font-weight: 600; color: var(--text3);
  box-shadow: var(--shadow-soft);
}
#wk.dark .wk-meta-pill { background: rgba(15,26,44,.90); border-color: rgba(148,163,184,.18); }
#wk .wk-meta-pill b { color: var(--text); font-weight: 800; }
#wk .wk-icon-btn {
  width: 38px; height: 38px; border-radius: 16px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.70); color: var(--text3);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-soft);
  cursor: pointer; transition: all .16s ease;
}
#wk.dark .wk-icon-btn { background: rgba(15,26,44,.90); border-color: rgba(148,163,184,.18); color: #94a3b8; }
#wk .wk-icon-btn:hover {
  background: var(--spx-soft); color: var(--orange);
  transform: translateY(-1px);
}
#wk .wk-icon-btn svg { width: 14px; height: 14px; }
#wk .spinning { animation: wspin .7s linear infinite; }
@keyframes wspin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════
   AUTOCOMPLETE
═══════════════════════════════════════════ */
#wk .ac-drop {
  position: absolute; top: calc(100% + 10px); left: 0; right: 0;
  background: var(--surface-solid); border: 1px solid var(--border2);
  border-radius: var(--radius-md); box-shadow: var(--shadow);
  z-index: 999; overflow: hidden;
  max-height: 360px; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
#wk.dark .ac-drop { background: #0d1a2e; border-color: rgba(148,163,184,.24); }
#wk .ac-drop::-webkit-scrollbar { width: 4px; }
#wk .ac-drop::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
#wk .ac-header {
  padding: 9px 16px 7px; font-size: 10px; font-weight: 800;
  letter-spacing: .10em; text-transform: uppercase; color: var(--text4);
  border-bottom: 1px solid var(--border); background: var(--surface2);
}
#wk.dark .ac-header { background: #081422; border-bottom-color: rgba(148,163,184,.14); }
#wk.dark .ac-footer { background: #081422; border-top-color: rgba(148,163,184,.14); }
#wk .ac-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 16px; cursor: pointer;
  border-bottom: 1px solid rgba(100,116,139,.07);
  transition: background .1s;
}
#wk .ac-item:last-child { border-bottom: none; }
#wk .ac-item:hover, #wk .ac-item.ac-active { background: rgba(249,115,74,.06); }
#wk.dark .ac-item:hover, #wk.dark .ac-item.ac-active { background: rgba(255,255,255,.04); }
#wk .ac-ic {
  width: 28px; height: 28px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
#wk .ac-ic svg { width: 13px; height: 13px; }
#wk .ac-info { flex: 1; min-width: 0; }
#wk .ac-title { font-size: 12.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#wk .ac-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
#wk .ac-team {
  font-size: 10px; font-weight: 800; color: var(--text4);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 1px 7px; white-space: nowrap;
}
#wk .ac-cat { font-size: 10.5px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#wk .ac-lk {
  font-size: 10px; font-weight: 800; color: var(--sky);
  background: rgba(56,163,199,.1); border: 1px solid rgba(56,163,199,.22);
  border-radius: 6px; padding: 1px 7px; flex-shrink: 0;
}
#wk .ac-empty { padding: 24px 16px; text-align: center; font-size: 12px; color: var(--text4); }
#wk .ac-footer {
  padding: 9px 16px; text-align: center;
  font-size: 11px; font-weight: 800; color: var(--text4);
  background: var(--surface2); border-top: 1px solid var(--border);
  cursor: pointer; transition: color .12s; letter-spacing: .03em;
}
#wk .ac-footer:hover { color: var(--orange); }

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
#wk .wk-layout { display: flex; flex: 1; overflow: hidden; }

/* ═══════════════════════════════════════════
   SIDEBAR — phong cách module aside của Index
═══════════════════════════════════════════ */
#wk .wk-sidebar {
  width: 262px; flex-shrink: 0;
  background: #f8fafc;
  border-right: 1px solid var(--border);
  box-shadow: 4px 0 18px rgba(31,41,55,.04);
  display: flex; flex-direction: column; overflow: hidden;
}
#wk.dark .wk-sidebar { background: #0d1524; border-right-color: rgba(148,163,184,.12); }

#wk .wk-side-top {
  padding: 16px 12px 12px;
  border-bottom: 1px solid var(--border);
  background: inherit;
}
/* Section title bar — đồng bộ .ops-section-title của Index */
#wk .wk-side-label {
  display: flex; align-items: center; gap: 8px;
  font-size: 10px; font-weight: 900; letter-spacing: .12em;
  text-transform: uppercase; color: var(--text2);
  margin-bottom: 11px;
}
#wk .wk-side-label::before {
  content: ""; width: 24px; height: 4px; border-radius: 4px;
  background: linear-gradient(90deg, var(--orange), var(--rose));
  flex-shrink: 0;
}
#wk .wk-side-filter {
  width: 100%; height: 34px;
  background: rgba(255,255,255,.90); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 0 12px;
  font-size: 12px; font-weight: 500; color: var(--text); outline: none;
  box-shadow: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
#wk.dark .wk-side-filter { background: #1a2744; border-color: rgba(148,163,184,.18); color: #e2e8f0; }
#wk .wk-side-filter:focus {
  border-color: rgba(249,115,74,.42);
  box-shadow: 0 0 0 3px rgba(249,115,74,.10);
  background: #fff;
}
#wk.dark .wk-side-filter:focus { background: #1e2f50; border-color: rgba(249,115,74,.42); }
#wk .wk-side-filter::placeholder { color: var(--text4); font-weight: 400; }

#wk .wk-side-nav {
  flex: 1; overflow-y: auto; padding: 8px 8px;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
#wk .wk-side-nav::-webkit-scrollbar { width: 3px; }
#wk .wk-side-nav::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* Nav items — đồng bộ .v-tab của Index  */
#wk .nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: var(--radius-md);
  cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text3);
  transition: all .14s; margin-bottom: 3px; user-select: none;
  border: 1px solid transparent;
}
#wk .nav-item:hover { background: rgba(249,115,74,.07); color: var(--text2); }
#wk.dark .nav-item:hover { background: rgba(249,115,74,.10); color: #e2e8f0; }
#wk .nav-item.active {
  background: rgba(255,255,255,.78); border-color: var(--border);
  color: var(--orange); font-weight: 800;
  box-shadow: var(--shadow-soft);
}
#wk.dark .nav-item.active { background: #1e2f50; border-color: rgba(249,115,74,.22); }
#wk .nav-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
#wk .nav-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#wk .nav-cnt {
  font-size: 10px; font-weight: 800; color: var(--text4);
  background: rgba(100,116,139,.12); border-radius: 6px; padding: 1px 7px; flex-shrink: 0;
}
#wk .nav-item.active .nav-cnt { background: rgba(249,115,74,.14); color: var(--orange); }

#wk .side-divider { padding: 10px 8px 4px; }
#wk .side-divider-line { height: 1px; background: var(--border); margin-bottom: 7px; }
#wk .side-divider-label {
  font-size: 9px; font-weight: 800; letter-spacing: .12em;
  text-transform: uppercase; color: var(--text4); padding-left: 2px;
}

/* ═══════════════════════════════════════════
   MAIN CONTENT
═══════════════════════════════════════════ */
#wk .wk-main {
  flex: 1; overflow-y: auto;
  padding: 18px 20px 32px;
  background: transparent;
  scrollbar-width: thin; scrollbar-color: var(--border2) transparent;
}
#wk .wk-main::-webkit-scrollbar { width: 5px; }
#wk .wk-main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 5px; }

/* ═══════════════════════════════════════════
   SECTION CARD — đồng bộ .ops-card Index
═══════════════════════════════════════════ */
#wk .section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 14px; overflow: hidden;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  position: relative;
}
#wk.dark .section-card { background: rgba(15,26,44,.92); }
#wk .section-card:hover {
  transform: translateY(-2px);
  border-color: rgba(249,115,74,.26);
  box-shadow: 0 18px 46px rgba(31,41,55,.12);
}
/* Border-top màu sắc đặc trưng theo palette */
#wk .section-card.p0 { border-top: 4px solid #f97316; }
#wk .section-card.p1 { border-top: 4px solid var(--sky); }
#wk .section-card.p2 { border-top: 4px solid var(--green); }
#wk .section-card.p3 { border-top: 4px solid #d97706; }
#wk .section-card.p4 { border-top: 4px solid var(--indigo); }
#wk .section-card.p5 { border-top: 4px solid var(--rose); }
#wk .section-card.p6 { border-top: 4px solid #0d9488; }
#wk .section-card.p7 { border-top: 4px solid #0284c7; }
#wk .section-card.p8 { border-top: 4px solid #94a3b8; }

/* Section header */
#wk .sec-header {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 18px; cursor: pointer; user-select: none;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
}
#wk .sec-header:hover { background: rgba(249,115,74,.04); }
#wk.dark .sec-header:hover { background: rgba(249,115,74,.06); }
#wk .sec-name {
  font-size: 11px; font-weight: 900;
  text-transform: uppercase; letter-spacing: .08em; flex: 1;
}
#wk .sec-count {
  font-size: 10px; font-weight: 800; color: var(--text4);
  background: rgba(100,116,139,.12); border: 1px solid var(--border);
  border-radius: 8px; padding: 2px 10px;
}
#wk .sec-chev { color: var(--text4); transition: transform .2s; flex-shrink: 0; }
#wk .sec-chev svg { width: 13px; height: 13px; }
#wk .sec-header.collapsed .sec-chev { transform: rotate(-90deg); }
#wk .sec-body.hidden { display: none; }

/* ═══════════════════════════════════════════
   CATEGORY ROW
═══════════════════════════════════════════ */
#wk .cat-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 18px 5px;
  background: rgba(100,116,139,.04);
  border-bottom: 1px solid var(--border);
}
#wk.dark .cat-row { background: rgba(148,163,184,.04); }
#wk .cat-tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 800; color: var(--text3);
  text-transform: uppercase; letter-spacing: .06em;
  background: var(--surface-solid); border: 1px solid var(--border2);
  border-radius: 99px; padding: 3px 11px; white-space: nowrap;
}
#wk.dark .cat-tag { background: rgba(20,31,49,.82); }
#wk .cat-tag svg { width: 9px; height: 9px; }
#wk .cat-line { flex: 1; height: 1px; background: var(--border); }

/* ═══════════════════════════════════════════
   DOC TABLE
   Tỉ lệ cột: icon 40px | nội dung flex | link 220px
═══════════════════════════════════════════ */
#wk .doc-table { width: 100%; border-collapse: collapse; }
#wk .doc-table tr { border-bottom: 1px solid rgba(100,116,139,.09); transition: background .1s; }
#wk .doc-table tr:last-child { border-bottom: none; }
#wk .doc-table tr:hover { background: rgba(249,115,74,.04); }
#wk.dark .doc-table tr:hover { background: rgba(249,115,74,.07); }
#wk.dark .doc-table tr { border-bottom-color: rgba(148,163,184,.08); }
#wk .doc-table td { padding: 12px 8px; vertical-align: middle; }

/* Cột icon — nhỏ cố định */
#wk td.c-ic { width: 46px; padding-left: 18px; padding-right: 6px; }
#wk .doc-ic {
  width: 32px; height: 32px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  box-shadow: 4px 4px 0 rgba(31,41,55,.05);
}
#wk .doc-ic svg { width: 14px; height: 14px; }

/* Cột nội dung — flex, chiếm phần lớn */
#wk td.c-content { padding-left: 4px; }
#wk .doc-title { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.4; }
#wk .doc-desc {
  font-size: 11.5px; color: var(--text3); margin-top: 3px;
  line-height: 1.6; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
#wk .doc-badges { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
#wk .badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700; border-radius: 8px; padding: 2px 9px;
}
#wk .badge-lock { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
#wk .badge-date { background: #f0fdf4; border: 1px solid #bbf7d0; color: #14532d; }
#wk.dark .badge-lock { background: rgba(253,186,116,.08); border-color: rgba(253,186,116,.22); color: #fbbf24; }
#wk.dark .badge-date { background: rgba(74,222,128,.08); border-color: rgba(74,222,128,.2); color: #86efac; }
#wk .badge svg { width: 9px; height: 9px; }

/* Cột link — cố định 220px, hợp lý cho nội dung */
#wk td.c-lk { width: 220px; padding-right: 18px; vertical-align: middle; }
#wk .link-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
#wk .link-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: var(--radius-sm);
  font-size: 11px; font-weight: 700;
  text-decoration: none; cursor: pointer;
  border: 1px solid var(--border2); background: rgba(255,255,255,.92);
  color: var(--sky); transition: all .15s; white-space: nowrap;
  max-width: 200px; overflow: hidden; text-overflow: ellipsis;
  box-shadow: var(--shadow-soft);
}
#wk.dark .link-btn { background: #1a2744; border-color: rgba(148,163,184,.22); color: #60bcd6; }
#wk .link-btn:hover {
  background: var(--sky); color: #fff; border-color: var(--sky);
  transform: translateY(-1px); box-shadow: 0 6px 14px rgba(56,163,199,.26);
}
#wk .link-btn svg { width: 10px; height: 10px; flex-shrink: 0; }
#wk .link-more {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 700;
  border: 1px dashed var(--border2); background: transparent;
  color: var(--text4); cursor: pointer; transition: .14s;

<script>
/* ══════════════════════════════════
   STATE & CONFIG — giữ nguyên logic
══════════════════════════════════ */
var W={d:[],g:{},t:[],cm:{},at:'ALL',q:'',tm:null,tail:[]};
var WP=['p0','p1','p2','p3','p4','p5','p6','p7'];
var WC={p0:'#f97316',p1:'#38a3c7',p2:'#36b37e',p3:'#d97706',p4:'#7c83d6',p5:'#e85d75',p6:'#0d9488',p7:'#0284c7',p8:'#94a3b8'};
var WIT=['Thuật Ngữ & Từ Viết Tắt','Trạng Thái Đơn Hàng','Phòng Ban & Chức Năng'];
var WTAIL=['Roadmap Lead','Roadmap Staff','Detail Công Việc',
           'Plan Đào Tạo Staff→Lead','Quy Đổi Ranking',
           'Thuật Ngữ & Từ Viết Tắt','Trạng Thái Đơn Hàng','Phòng Ban & Chức Năng'];

/* ── DARK MODE SYNC ── */
function wSyncDark(){
  var el=document.getElementById('wk'); if(!el)return;
  var isDark=false;
  /* 1. Ưu tiên: class .dark trên <html> của cùng document */
  try{isDark=document.documentElement.classList.contains('dark');}catch(e){}
  /* 2. Class .dark trên <html> của parent window (iframe) */
  if(!isDark){try{isDark=!!(window.parent&&window.parent!==window&&window.parent.document.documentElement.classList.contains('dark'));}catch(e){}}
  /* 3. localStorage 'spx_theme' — đồng bộ key với index.html */
  if(!isDark){
    try{
      var pref=(window.parent!==window?window.parent.localStorage:localStorage).getItem('spx_theme')||'auto';
      if(pref==='dark'){isDark=true;}
      else if(pref==='auto'){var h=new Date().getHours();isDark=(h>=18||h<6);}
    }catch(e){
      try{
        var pref2=localStorage.getItem('spx_theme')||'auto';
        if(pref2==='dark'){isDark=true;}
        else if(pref2==='auto'){var h2=new Date().getHours();isDark=(h2>=18||h2<6);}
      }catch(e2){}
    }
  }
  if(isDark) el.classList.add('dark'); else el.classList.remove('dark');
}
wSyncDark();
(function(){
  /* Observe class changes on parent or current document */
  try{
    var target=(window.parent&&window.parent!==window)?window.parent.document.documentElement:document.documentElement;
    var obs=new MutationObserver(function(muts){muts.forEach(function(m){if(m.attributeName==='class')wSyncDark();});});
    obs.observe(target,{attributes:true,attributeFilter:['class']});
    /* Also observe current document (khi JS_Tailieu mở standalone) */
    if(target!==document.documentElement){
      var obs2=new MutationObserver(function(muts){muts.forEach(function(m){if(m.attributeName==='class')wSyncDark();});});
      obs2.observe(document.documentElement,{attributes:true,attributeFilter:['class']});
    }
  }catch(e){setInterval(wSyncDark,800);}
  /* Lắng nghe storage event khi index.html thay đổi theme */
  try{
    window.addEventListener('storage',function(e){if(e.key==='spx_theme')wSyncDark();});
    if(window.parent&&window.parent!==window){
      window.parent.addEventListener('storage',function(e){if(e.key==='spx_theme')wSyncDark();});
    }
  }catch(e){}
})();

/* ── LOAD ── */
// [ĐÃ XOÁ — wBack(), logo giờ chỉ hiển thị tĩnh, không còn click-to-home nữa —
// sidebar đã có sẵn điều hướng, không cần "trang chủ" riêng trong từng module]

function wLoad(force){
  var rb=document.getElementById('wRbIcon');
  rb.classList.add('spinning');
  wShowState('loading');
  if(!force){
    try{var c=sessionStorage.getItem('_W11');if(c){var p=JSON.parse(c);if(p&&p.d&&p.d.length>0){rb.classList.remove('spinning');wProc(p.d,p.tail||WTAIL);return;}}}catch(e){}
  }
  if(typeof google!=='undefined'&&google.script){
    google.script.run
      .withFailureHandler(function(e){rb.classList.remove('spinning');wShowErr(e.message||String(e));})
      .withSuccessHandler(function(r){
        rb.classList.remove('spinning');
        if(!r||!r.success){wShowErr(r&&r.error||'Lỗi không xác định');return;}
        try{sessionStorage.setItem('_W11',JSON.stringify({d:r.data,tail:r.tailTeams||WTAIL}));}catch(e){}
        wProc(r.data||[],r.tailTeams||WTAIL);
      })
      .wiki_getDocumentData_v2(!!force);
  }else{rb.classList.remove('spinning');wProc(wDemo(),WTAIL);}
}

function wProc(data,tail){
  W.d=data||[];W.g={};W.t=[];W.cm={};W.tail=tail||WTAIL;
  W.d.forEach(function(it){var t=(it.team||'Khác').trim();if(!W.g[t])W.g[t]=[];W.g[t].push(it);});
  var main=[],tl=[];
  Object.keys(W.g).forEach(function(t){W.tail.indexOf(t)>=0?tl.push(t):main.push(t);});
  main.sort(function(a,b){return a.localeCompare(b,'vi');});
  tl.sort(function(a,b){return W.tail.indexOf(a)-W.tail.indexOf(b);});
  W.t=main.concat(tl);
  W.t.forEach(function(t,i){W.cm[t]=W.tail.indexOf(t)>=0?'p8':WP[i%WP.length];});
  document.getElementById('wTc').textContent=W.d.length;
  document.getElementById('wGc').textContent=W.t.length;
  wBuildNav();wRender();
  var mn=document.getElementById('wMn');
  if(!W._scrollBound){
    mn.addEventListener('scroll',function(){
      var up=document.getElementById('wUp');
      this.scrollTop>300?up.classList.add('visible'):up.classList.remove('visible');
    });
    W._scrollBound=true;
  }
}

/* ── SIDEBAR ── */
function wBuildNav(f){
  f=(f||'').toLowerCase(); var h='';
  if(!f){
    h+='<div class="nav-item '+(W.at==='ALL'?'active':'')+'" onclick="wSel(\'ALL\')">'
      +'<div class="nav-dot" style="background:#94a3b8"></div>'
      +'<span class="nav-name">Tất cả</span>'
      +'<span class="nav-cnt">'+W.d.length+'</span></div>';
  }
  var hasTail=false;
  W.t.forEach(function(t){
    if(f&&t.toLowerCase().indexOf(f)<0)return;
    var isTail=W.tail.indexOf(t)>=0;
    var cc=W.cm[t],dc=WC[cc]||'#94a3b8';
    if(isTail&&!hasTail&&!f){
      h+='<div class="side-divider"><div class="side-divider-line"></div><div class="side-divider-label">Tham khảo</div></div>';
      hasTail=true;
    }
    h+='<div class="nav-item '+(W.at===t?'active':'')+'" onclick="wSel(\''+wEA(t)+'\')">'
      +'<div class="nav-dot" style="background:'+dc+'"></div>'
      +'<span class="nav-name" title="'+wE(t)+'">'+wE(t)+'</span>'
      +'<span class="nav-cnt">'+W.g[t].length+'</span></div>';
  });
  document.getElementById('wNav').innerHTML=h;
}
function wFN(v){wBuildNav(v);}
function wSel(t){W.at=t;W.q='';document.getElementById('wQ').value='';wAcHide();wBuildNav();wRender();document.getElementById('wMn').scrollTop=0;}

/* ── SEARCH + AUTOCOMPLETE ── */
var WAC={idx:-1,results:[],timer:null};
function wSrch(v){
  clearTimeout(WAC.timer);
  WAC.timer=setTimeout(function(){
    W.q=v.trim().toLowerCase();
    if(W.q){W.at='ALL';wAcShow(v);}else{wAcHide();}
    wBuildNav();wRender();
  },180);
}
function wAcShow(v){
  var q=(v||'').trim().toLowerCase();
  var drop=document.getElementById('wAc'); if(!drop)return;
  if(q.length<1){wAcHide();return;}
  WAC.idx=-1;
  var results=[];
  W.d.forEach(function(it){
    var tl=(it.title||'').toLowerCase(),ct=(it.category||'').toLowerCase(),
        tm=(it.team||'').toLowerCase(),de=(it.description||'').toLowerCase();
    var lkm=(it.links||[]).some(function(l){return(l.name||'').toLowerCase().indexOf(q)>=0;});
    var score=0;
    if(tl.indexOf(q)===0)score=4;
    else if(tl.indexOf(q)>=0)score=3;
    else if(ct.indexOf(q)>=0)score=2;
    else if(tm.indexOf(q)>=0)score=2;
    else if(de.indexOf(q)>=0)score=1;
    else if(lkm)score=1;
    if(score>0)results.push({it:it,score:score});
  });
  results.sort(function(a,b){if(b.score!==a.score)return b.score-a.score;return(a.it.title||'').localeCompare(b.it.title||'','vi');});
  WAC.results=results;
  var MAX=8,shown=results.slice(0,MAX);
  if(!shown.length){drop.innerHTML='<div class="ac-empty">Không tìm thấy kết quả phù hợp</div>';drop.style.display='block';return;}
  var h='<div class="ac-header">Gợi ý — '+results.length+' kết quả</div>';
  shown.forEach(function(r,i){
    var it=r.it,cc=W.cm[it.team]||'p8',dc=WC[cc]||'#94a3b8';
    var lkCount=(it.links||[]).filter(function(l){return l.url&&l.url.startsWith('http');}).length;
    var lkBadge=lkCount>0?'<span class="ac-lk">'+lkCount+' link</span>':'';
    h+='<div class="ac-item" data-idx="'+i+'" onmousedown="wAcPick(event,'+i+')" onmouseover="wAcHover('+i+')">'
      +'<div class="ac-ic" style="background:rgba('+wHex2r(dc)+',.12);color:'+dc+'">'
      +'<svg viewBox="0 0 16 16" fill="currentColor">'+wIco(it.category+' '+it.title)+'</svg></div>'
      +'<div class="ac-info"><div class="ac-title">'+wH(it.title,q)+'</div>'
      +'<div class="ac-meta"><span class="ac-team" style="color:'+dc+'">'+wE(it.team)+'</span>'
      +'<span class="ac-cat">'+wE(it.category)+'</span>'+lkBadge+'</div></div></div>';
  });
  if(results.length>MAX){h+='<div class="ac-footer" onmousedown="wAcConfirm()">Xem tất cả '+results.length+' kết quả →</div>';}
  drop.innerHTML=h; drop.style.display='block';
}
function wAcHide(){var d=document.getElementById('wAc');if(d)d.style.display='none';WAC.idx=-1;}
function wAcHover(idx){WAC.idx=idx;document.querySelectorAll('#wAc .ac-item').forEach(function(el,i){el.classList.toggle('ac-active',i===idx);});}
function wAcPick(e,idx){
  e.preventDefault();var r=WAC.results[idx];if(!r)return;var it=r.it;
  document.getElementById('wQ').value=it.title;W.q=it.title.toLowerCase();W.at=it.team;
  wAcHide();wBuildNav();wRender();
  setTimeout(function(){var sid='s'+wSf(it.team);var el=document.getElementById(sid);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},80);
}
function wAcConfirm(){var q=document.getElementById('wQ').value.trim();if(!q)return;W.q=q.toLowerCase();W.at='ALL';wAcHide();wBuildNav();wRender();}
function wAcKey(e){
  var drop=document.getElementById('wAc');
  if(!drop||drop.style.display==='none'){if(e.key==='Escape'){document.getElementById('wQ').value='';W.q='';wBuildNav();wRender();}return;}
  var items=drop.querySelectorAll('.ac-item');
  if(e.key==='ArrowDown'){e.preventDefault();WAC.idx=Math.min(WAC.idx+1,items.length-1);items.forEach(function(el,i){el.classList.toggle('ac-active',i===WAC.idx);});if(items[WAC.idx])items[WAC.idx].scrollIntoView({block:'nearest'});}
  else if(e.key==='ArrowUp'){e.preventDefault();WAC.idx=Math.max(WAC.idx-1,0);items.forEach(function(el,i){el.classList.toggle('ac-active',i===WAC.idx);});if(items[WAC.idx])items[WAC.idx].scrollIntoView({block:'nearest'});}
  else if(e.key==='Enter'){e.preventDefault();if(WAC.idx>=0&&WAC.results[WAC.idx]){wAcPick({preventDefault:function(){}},WAC.idx);}else{wAcConfirm();}}
  else if(e.key==='Escape'){wAcHide();document.getElementById('wQ').focus();}
}
document.addEventListener('click',function(e){var bar=document.querySelector('#wk .wk-search-wrap');if(bar&&!bar.contains(e.target))wAcHide();});
function wHex2r(hex){var r=parseInt(hex.slice(1,3),16)||148,g=parseInt(hex.slice(3,5),16)||163,b=parseInt(hex.slice(5,7),16)||184;return r+','+g+','+b;}

/* ── RENDER ── */
function wRender(){
  var mn=document.getElementById('wMn'),q=W.q;
  var teams=W.at==='ALL'?W.t:[W.at];
  var secs=[];
  teams.forEach(function(t){
    var items=(W.g[t]||[]).slice();
    if(q)items=items.filter(function(it){
      return[(it.title||''),(it.description||''),(it.category||''),(it.team||'')].some(function(s){return s.toLowerCase().indexOf(q)>=0;})
        ||(it.links||[]).some(function(l){return(l.name||'').toLowerCase().indexOf(q)>=0||(l.url||'').toLowerCase().indexOf(q)>=0;});
    });
    if(items.length)secs.push({t:t,items:items});
  });
  if(!secs.length){
    mn.innerHTML='<div class="wk-state"><div class="state-icon">🔍</div><h3>Không tìm thấy tài liệu</h3><p>Thử từ khóa khác hoặc chọn team khác</p></div>';
    return;
  }
  var h='';
  secs.forEach(function(s){
    var cc=W.cm[s.t],dc=WC[cc]||'#94a3b8';
    var isInfo=WIT.indexOf(s.t)>=0;
    var sid='s'+wSf(s.t);
    var cats={};
    s.items.forEach(function(it){var c=(it.category||'Khác').trim();if(!cats[c])cats[c]=[];cats[c].push(it);});
    h+='<div class="section-card '+cc+'" id="'+sid+'">'
      +'<div class="sec-header" onclick="wTog(\''+sid+'\')">'
      +'<div class="sec-name" style="color:'+dc+'">'+wH(s.t,q)+'</div>'
