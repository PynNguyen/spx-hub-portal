<div class="qdo-scroll" data-scroll-root="true" id="qdo-body"><div class="qdo-load">Đang tải dữ liệu Delivery…</div></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   DELIVERY OPERATION CONTROL (REQ-006) — [TÁI CẤU TRÚC 2026-10] theo wireframe V2.25
   Dữ liệu: đúng nguồn Quá hạn hiện có do trang chủ nạp (allData = đơn LM aging + đơn đã chốt Lost).
   QUY TẮC (đã đối chiếu với sheet 'Backlog FM+LM' — khớp từng số 681/477/5.553/1.564/516):
     • Mốc tuổi = timingDate (số ngày tồn TẠI TRẠM HIỆN TẠI): ≤1 | 1–2 | 2–5 | 5–7 | >7 ngày.
     • Nhóm wireframe: "1–2 ngày" = ≤2 · "3–5 ngày" = >2 và ≤5 · "Trên 5 ngày" = >5.
     • On-hold = trạng thái cuối (finalStatus) chứa "onhold".
     • Upcoming Lost = đơn có cờ "Lost today" (Đến hạn lost hôm nay) · Amount = tổng COGS của chính các đơn đó.
     • Đã chốt Lost = đơn trong nguồn Lost (isChotLost) — giữ lại từ module cũ.
   Chưa có nguồn nên CHƯA làm: theo Tỉnh/Thành phố, Phường/Xã, Rider, lý do On-hold, "2 days/1 day to Lost".
   GIỮ NGUYÊN các hàm trang chủ/module khác gọi vào (xem khối COMPAT cuối file).
   ═══════════════════════════════════════════════════════════════════════ */
var currentModeQH = 'GIAO';
var _qhLmFullPicRaw = null;
var currentEditingId = '', currentEditingHub = '';

var QDO = { sel: { aom: '', sup: '', hub: '' }, cat: 'ALL', kf: '', rows: null, rowsRef: null, rowsLen: -1,
            L: { grp: '', proc: '', fin: '', flag: '', q: '', page: 1 }, inited: false };
QDO.drill = { aom: '', sup: '', hub: '' };
var QDO_PAGE = 25;
var QDO_B5 = [['≤ 1 ngày', '#2563eb'], ['1–2 ngày', '#3b82f6'], ['2–5 ngày', '#f59e0b'], ['5–7 ngày', '#f97316'], ['> 7 ngày', '#dc2626']];

/* ───────── tiện ích ───────── */
function qdoEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function qdoInt(x) { return (x == null || !isFinite(x)) ? '—' : Math.round(x).toLocaleString('en-US'); }
function qdoMoney(v) {
  if (v == null || !isFinite(v)) return '—';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'Mđ';
  if (v >= 1e3) return Math.round(v / 1e3) + 'Kđ';
  return Math.round(v) + 'đ';
}
function qdoUniq(a) { var o = {}, r = []; a.forEach(function (x) { if (x && !o[x]) { o[x] = 1; r.push(x); } }); return r; }
function qdoSortVi(a) { return a.slice().sort(function (x, y) { return String(x).localeCompare(String(y), 'vi'); }); }
function qdoToast(msg, type) {
  var t = document.createElement('div'); t.className = 'qdo-toast'; t.style.background = type === 'error' ? '#ef4444' : '#10b981'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(function () { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; }, 1800); setTimeout(function () { t.remove(); }, 2300);
}
function qdoNum(v) { if (v == null || v === '') return null; var n = Number(v); return isFinite(n) ? n : null; }
function qdoMoneyOf(v) {                  // core: số; lost: chuỗi "999.999 đ" (dấu chấm là phân cách nghìn)
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  var d = String(v).replace(/[^\d]/g, ''); return d ? Number(d) : null;
}

/* ───────── chuẩn hoá dữ liệu từ allData ───────── */
function qdoGrpOf(t) { return t == null ? 'na' : t <= 2 ? 'g12' : t <= 5 ? 'g35' : 'g5p'; }
function qdoB5Of(t) { return t == null ? -1 : t <= 1 ? 0 : t <= 2 ? 1 : t <= 5 ? 2 : t <= 7 ? 3 : 4; }
function qdoRows() {
  var src = (typeof allData !== 'undefined' && allData) ? allData : [];
  if (QDO.rows && QDO.rowsRef === src && QDO.rowsLen === src.length) return QDO.rows;
  var out = [];
  for (var i = 0; i < src.length; i++) {
    var r = src[i]; if (!r) continue;
    var aom = getAomVal(r); if (aom.toUpperCase() === 'AOM') continue;      // dòng tiêu đề lọt vào nguồn
    var chot = r.isChotLost === true || String(r.isChotLost).toLowerCase() === 'true';
    var t = qdoNum(r.timingDate);
    var fin = String(r.finalStatus == null ? '' : r.finalStatus);
    var hub = getHubVal(r);
    var sup = getSupVal(r);
    // [FIX 2026-10] Tự động bổ sung AOM / SUP từ danh bạ trạm cho các đơn Chốt Lost hoặc đơn chưa có AOM/SUP
    if (!aom || aom === '-' || aom === 'Chưa phân AOM' || !sup || sup === '-' || sup === 'Chưa phân SUP') {
      var org = (typeof spxGetHubOrgInfo === 'function') ? spxGetHubOrgInfo(hub) : null;
      if (org) {
        if (!aom || aom === '-' || aom === 'Chưa phân AOM') aom = org.aom || aom;
        if (!sup || sup === '-' || sup === 'Chưa phân SUP') sup = org.sup || sup;
      }
    }
    out.push({ r: r, id: String(r.shipmentId || ''), hub: hub, aom: aom || 'Chưa phân AOM', sup: sup || 'Chưa phân SUP', chot: chot,
      up: !chot && (String(r.lostToday || '').toLowerCase().indexOf('today') >= 0 || String(r.aging || '').toLowerCase().indexOf('today') >= 0),
      proc: String(r.processStatus || r.status || '').trim() || 'Đang xử lý (Khác)', fin: fin, onhold: !chot && fin.toLowerCase().indexOf('onhold') >= 0,
      t: t, age: qdoNum(r.aging), grp: qdoGrpOf(t), b5: qdoB5Of(t), cogs: qdoMoneyOf(r.cogs) });
  }
  QDO.rows = out; QDO.rowsRef = src; QDO.rowsLen = src.length; return out;
}
function qdoHasCogs() { var rows = qdoRows(); for (var i = 0; i < rows.length; i++) if (rows[i].cogs != null) return true; return false; }

/** Phạm vi "xem thử" của Admin (giữ nguyên cách module cũ lọc: ROM theo danh sách Hub, AOM/SUP theo tên). */
function qdoPreviewFilter(rows) {
  var f = (typeof qhGetActivePreviewOrgFilter === 'function') ? qhGetActivePreviewOrgFilter() : null;
  if (!f) return rows;
  if (f.field === 'rom' && f.hubs) { var set = {}; f.hubs.forEach(function (h) { set[cleanHubString(h)] = 1; }); return rows.filter(function (x) { return set[cleanHubString(x.hub)]; }); }
  if (f.field === 'aom') return rows.filter(function (x) { return x.aom === f.value; });
  if (f.field === 'sup') return rows.filter(function (x) { return x.sup === f.value; });
  return rows;
}
function qdoCardFilter(rows) {      // bộ lọc theo THẺ KPI đang chọn (QDO.kf): backlog | g12 | g35 | g5p | onhold | up | chot
  var k = QDO.kf; if (!k) return rows;
  return rows.filter(function (x) {
    if (k === 'chot') return x.chot;
    if (x.chot) return false;
    if (k === 'backlog') return true; if (k === 'onhold') return x.onhold; if (k === 'up') return x.up;
    return x.grp === k;
  });
}
function qdoBase() { return qdoCardFilter(qdoPreviewFilterCached()); }
var _qdoPf = { src: null, key: '', out: null };
function qdoPreviewFilterCached() {
  var rows = qdoRows(), f = (typeof qhGetActivePreviewOrgFilter === 'function') ? qhGetActivePreviewOrgFilter() : null;
  var key = f ? JSON.stringify([f.field, f.value, f.hubs ? f.hubs.length : 0]) : '';
  if (_qdoPf.src === rows && _qdoPf.key === key) return _qdoPf.out;
  _qdoPf = { src: rows, key: key, out: qdoPreviewFilter(rows) }; return _qdoPf.out;
}
function qdoScoped(noCard) {        // noCard=true: bỏ bộ lọc thẻ (dùng để các thẻ KPI luôn hiện số của TOÀN phạm vi)
  var s = QDO.sel;
  var cHub = s.hub ? cleanHubString(s.hub) : '';
  return (noCard ? qdoPreviewFilterCached() : qdoBase()).filter(function (x) {
    if (cHub) {
      return cleanHubString(x.hub) === cHub;
    }
    if (s.sup) {
      return x.sup === s.sup && (!s.aom || x.aom === s.aom);
    }
    if (s.aom) {
      return x.aom === s.aom;
    }
    return true;
  });
}
function qdoLevel() { return QDO.sel.hub ? 'lead' : QDO.sel.sup ? 'sup' : QDO.sel.aom ? 'aom' : 'rom'; }
var QDO_LV = { rom: 'L1 · ROM', aom: 'L2 · AOM', sup: 'L3 · SUP', lead: 'L4 · LEAD' };

function qdoAgg(rows) {
  var a = { total: 0, g12: 0, g35: 0, g5p: 0, onhold: 0, up: 0, upAmt: 0, chot: 0, chotAmt: 0, b5: [0, 0, 0, 0, 0], proc: {} };
  for (var i = 0; i < rows.length; i++) {
    var x = rows[i];
    if (x.chot) { a.chot++; a.chotAmt += x.cogs || 0; continue; }
    a.total++; if (x.grp !== 'na') a[x.grp]++; if (x.b5 >= 0) a.b5[x.b5]++;
    if (x.onhold) a.onhold++;
    if (x.up) { a.up++; a.upAmt += x.cogs || 0; }
    a.proc[x.proc] = (a.proc[x.proc] || 0) + 1;
  }
  return a;
}

/* ───────── PHÂN CẤP — MỘT NGUỒN DUY NHẤT: HEADER TRANG CHỦ ─────────
   Cấp xem = vai trò thật (dữ liệu đã được máy chủ lọc theo quyền) hoặc "XEM THỬ" cấp của Admin (qhGetActivePreviewOrgFilter),
   cộng Hub đang chọn ở header (spx_default_hub). Module KHÔNG có bộ chọn cấp riêng; chỉ cho "đi xuống" bằng cách bấm
   một dòng (drill) và "Quay lại cấp trên". Đổi cấp/Hub ở header → xoá drill và vẽ lại. */
function qdoIsAdmin() { return !!(window.SPX_ACCESS && window.SPX_ACCESS.role === 'admin'); }
function qdoPreviewActive() { return typeof qhGetActivePreviewOrgFilter === 'function' && !!qhGetActivePreviewOrgFilter(); }
function qdoHostSel() {
  var rows = qdoPreviewFilterCached(), s = { aom: '', sup: '', hub: '' };
  var hh = ''; try { hh = localStorage.getItem('spx_default_hub') || ''; } catch (e) {}
  if (hh && hh !== 'ALL') {
    var t = cleanHubString(hh), x = rows.filter(function (r) { return cleanHubString(r.hub) === t; })[0];
    if (x) { s.aom = x.aom; s.sup = x.sup; s.hub = x.hub; } else { s.hub = hh; }
  }
  if ((!qdoIsAdmin() || qdoPreviewActive()) && rows.length) {      // phạm vi hẹp: tự đi xuống cấp thấp nhất còn 1 lựa chọn
    var pool = rows.filter(function (x) { return (!s.aom || x.aom === s.aom) && (!s.sup || x.sup === s.sup); });
    var aoms = qdoUniq(pool.map(function (x) { return x.aom; })); if (!s.aom && aoms.length === 1) s.aom = aoms[0];
    if (s.aom && !s.sup) { var sups = qdoUniq(rows.filter(function (x) { return x.aom === s.aom; }).map(function (x) { return x.sup; })); if (sups.length === 1) s.sup = sups[0]; }
    if (s.sup && !s.hub) { var hubs = qdoUniq(rows.filter(function (x) { return x.aom === s.aom && x.sup === s.sup; }).map(function (x) { return x.hub; })); if (hubs.length === 1) s.hub = hubs[0]; }
  }
  return s;
}
function qdoComputeSel() { var h = qdoHostSel(), d = QDO.drill; return { aom: h.aom || d.aom || '', sup: h.sup || d.sup || '', hub: h.hub || d.hub || '' }; }

  const content = document.getElementById('noteModalContent');
  modal.classList.remove('hidden');
  setTimeout(() => content.classList.replace('scale-95','scale-100'), 10);
  document.getElementById('noteInputText').focus();
}

function closeNoteModal() {
  const modal = document.getElementById('noteModal');
  const content = document.getElementById('noteModalContent');
  content.classList.replace('scale-100','scale-95');
  setTimeout(() => modal.classList.add('hidden'), 150);
  currentEditingId = '';
  currentEditingHub = '';
}

function saveNote() {
  const txt = document.getElementById('noteInputText').value.trim();
  if (!txt) return showToast(qhT('Vui lòng nhập nội dung note!'), 'error', 'quahan');
  const btn = document.getElementById('btnSaveNote');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> LƯU NOTE';
  google.script.run
    .withFailureHandler(() => { showToast(qhT('Lỗi máy chủ!'),'error','quahan'); btn.disabled=false; btn.innerText='LƯU NOTE'; })
    .withSuccessHandler(resStr => {
      const res = JSON.parse(resStr);
      if (res.success) {
        globalNotes[currentEditingId] = { text: txt, user: res.user, time: res.time };
        if (currentModeQH === 'GIAO') applyFiltersQH(); else applyFiltersFM();
        closeNoteModal(); showToast(qhT('Đã lưu note!'),'success','quahan');
      }
      btn.disabled=false; btn.innerText='LƯU NOTE';
    }).aging_saveNote(currentEditingId, txt, currentEditingHub);
}

function refreshNotesOnly() {      // chạy NGẦM mỗi lần đồng bộ: không hiện thông báo (trước đây báo "Đang tải lại ghi chú…" mỗi lần)
  if (window._qhNoteSyncing) return;
  window._qhNoteSyncing = true;
  google.script.run
    .withSuccessHandler(function (resStr) {
      var res; try { res = JSON.parse(resStr); } catch (e) { res = null; }
      if (res && res.success) { var next = res.notes || {}; if (JSON.stringify(next) !== JSON.stringify(globalNotes)) { globalNotes = next; if (qdoLevel() === 'lead') applyFiltersQH(); } }
      window._qhNoteSyncing = false;
    })
    .withFailureHandler(function () { window._qhNoteSyncing = false; })
    .aging_getNotesOnly();
}
function qhPreloadRomScope(romEmail, cb){
  romEmail = String(romEmail || '').toLowerCase().trim();
  if (!romEmail) return;
  if (window._qhRomScope && window._qhRomScope.email === romEmail) { if (cb) cb(); return; }
  if (typeof google === 'undefined' || !google.script) return;
  google.script.run
    .withFailureHandler(function(){ window._qhRomScope = { email: romEmail, hubs: [] }; if (cb) cb(); })
    .withSuccessHandler(function(res){
      var r; try { r = JSON.parse(res); } catch(e){ r = null; }
      window._qhRomScope = { email: romEmail, hubs: (r && r.success && r.hubs) ? r.hubs : [] };
      if (cb) cb();
    })
    .rom_getScopeForPreview(romEmail);
}

function qhGetActivePreviewOrgFilter(){
  var isRealAdmin = !!(window.SPX_ACCESS && window.SPX_ACCESS.role === 'admin');
  if (!isRealAdmin) return null;
  var level = window.SPX_PREVIEW_LEVEL;
  if (!level || level === 'admin' || level === 'lead' || level === 'staff') return null;
  // [SỬA — rà soát: "ROM đã được cấu hình thật, sao code vẫn ghi chưa có phân vùng?"]
  // Ghi chú cũ đúng ở thời điểm chưa có tính năng Phân cấp ROM. Nay ROM đã được cấu
  // hình thật (sheet ROM_Roles: ROM quản danh sách AOM), và backend _rom_getScope()
  // trả ra đúng danh sách trạm của ROM đó. Không còn lý do bỏ qua cấp này.
  // ROM lọc theo DANH SÁCH TRẠM (một ROM quản nhiều AOM) chứ không theo 1 giá trị,
  // nên dùng trường riêng 'hubs'; danh sách được nạp sẵn bởi qhPreloadRomScope().
  if (level === 'rom') {
    var romEnt = (typeof window.SPX_PREVIEW_ENTITY === 'string' && window.SPX_PREVIEW_ENTITY) ? window.SPX_PREVIEW_ENTITY : '';
    var romHubs = (window._qhRomScope && window._qhRomScope.email === romEnt) ? (window._qhRomScope.hubs || []) : null;
    if (romEnt && romHubs && romHubs.length) return { field: 'rom', value: romEnt, hubs: romHubs };
    return null;   // chưa nạp xong phạm vi ROM -> chưa lọc, tránh hiện số sai
  }
  if (level !== 'sup' && level !== 'aom') return null;
  var directEntity = (typeof window.SPX_PREVIEW_ENTITY === 'string' && window.SPX_PREVIEW_ENTITY) ? window.SPX_PREVIEW_ENTITY : '';
  if (directEntity) return { field: level, value: directEntity };
  var hub = localStorage.getItem('spx_default_hub') || 'ALL';
  if (hub !== 'ALL' && typeof spxGetHubOrgInfo === 'function') {
    var orgInfo = spxGetHubOrgInfo(hub);
    if (orgInfo) {
      var v = level === 'sup' ? orgInfo.sup : orgInfo.aom;
      if (v) return { field: level, value: v };
    }
  }
  return null; // Chưa có gì để neo phạm vi (chưa chọn entity, chưa chọn Hub) -> không lọc gì thêm
}

function quahanApplyAccessUI(access) { try { QDO.access = access; qdoRender(); } catch (e) {} }

</script>
