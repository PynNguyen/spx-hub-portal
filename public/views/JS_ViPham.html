function vpLoadData(force, silent){
  if (VP_isLoading) return;
  VP_isLoading = true;
  var spin = document.getElementById('vp-refresh-icon');
  if (spin) spin.classList.add('fa-spin');
  if (!silent) {
    var subtitleEl = document.getElementById('vp-scope-subtitle');
    if (subtitleEl) subtitleEl.textContent = vpT('Đang đồng bộ dữ liệu...');
    vpRenderLoadingSkeletons();
  }
  google.script.run
    .withSuccessHandler(function(res){
      VP_isLoading = false;
      if (spin) spin.classList.remove('fa-spin');
      if (res && res.error) {
        var wrap = document.getElementById('vp-table-wrap');
        if (wrap && !silent) {
          wrap.innerHTML = '<div class="vp-loading-panel text-rose-500 dark:text-rose-400">' +
            '<i class="fas fa-circle-exclamation text-2xl text-rose-500 mb-1"></i>' +
            '<div class="vp-loading-title text-rose-600 dark:text-rose-400">' + vpT('Lỗi tải dữ liệu') + ': ' + _vpEsc(res.error) + '</div>' +
            '<button onclick="vpLoadData(true)" class="mt-2 px-3 py-1.5 rounded-lg bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-xs font-bold text-rose-600 dark:text-rose-400 hover:bg-rose-100 cursor-pointer">' + vpT('Thử lại') + '</button>' +
            '</div>';
        }
        return;
      }
      var next = vpSortNewestFirst(Array.isArray(res) ? res : []);
      VP_loadedAt = Date.now();
      if (silent && next.length === VP_allCases.length &&
          (next.length === 0 || (next[next.length-1].case_id === VP_allCases[VP_allCases.length-1].case_id &&
                                 next[0].case_id === VP_allCases[0].case_id))) {
        vpRenderFreshness();
        return;
      }
      VP_allCases = next;
      if (!silent) VP_page = 1;
      vpRenderFreshness();
      vpRenderFilterBar();
      vpRenderLevel1Tabs();
      vpRenderMain();
    })
    .withFailureHandler(function(err){
      VP_isLoading = false;
      if (spin) spin.classList.remove('fa-spin');
      var wrap = document.getElementById('vp-table-wrap');
      if (wrap && !silent) {
        wrap.innerHTML = '<div class="vp-loading-panel text-rose-500 dark:text-rose-400">' +
          '<i class="fas fa-circle-exclamation text-2xl text-rose-500 mb-1"></i>' +
          '<div class="vp-loading-title text-rose-600 dark:text-rose-400">' + vpT('Lỗi tải dữ liệu') + ': ' + _vpEsc(err.message || String(err)) + '</div>' +
          '<button onclick="vpLoadData(true)" class="mt-2 px-3 py-1.5 rounded-lg bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-xs font-bold text-rose-600 dark:text-rose-400 hover:bg-rose-100 cursor-pointer">' + vpT('Thử lại') + '</button>' +

}

function vpCaseSortKey(c){
  var d = String(c.case_create_date || '').slice(0, 10);
  var tm = String(c.case_create_time || '');
  return d + 'T' + (tm.length >= 19 ? tm.slice(11, 19) : '');
}
function vpSortNewestFirst(arr){
  return arr.map(function(c, i){ return { c: c, i: i, k: vpCaseSortKey(c) }; })
    .sort(function(a, b){ return a.k < b.k ? 1 : (a.k > b.k ? -1 : a.i - b.i); })
    .map(function(x){ return x.c; });
}

function vpComputeDataInfo(){
  var perDay = {}, max = '';
  for (var i = 0; i < VP_allCases.length; i++) {
    var d = String(VP_allCases[i].case_create_date || '').slice(0, 10);
    if (!/^d{4}-d{2}-d{2}$/.test(d)) continue;
    perDay[d] = (perDay[d] || 0) + 1;
    if (d > max) max = d;
  }
  if (!max) return null;
  var days = Object.keys(perDay).sort();
  var prev = days.slice(Math.max(0, days.length - 8), days.length - 1).map(function(k){ return perDay[k]; }).sort(function(a, b){ return a - b; });
  var median = prev.length ? prev[Math.floor(prev.length / 2)] : 0;
  return { max: max, cnt: perDay[max], total: VP_allCases.length, partial: !!(median && perDay[max] < median * 0.4) };
}

function vpInstallAutoRefresh(){
  if (VP_freshInstalled) return;
  VP_freshInstalled = true;
  var tick = function(){
    try {
      if (document.hidden || VP_isLoading) return;
      var main = document.getElementById('view-violation');
      if (!main || main.offsetParent === null) return;
      if (VP_loadedAt && Date.now() - VP_loadedAt < VP_AUTO_REFRESH_MS) return;
      vpLoadData(false, true);
    } catch (e) {}
  };
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) tick(); });
  setInterval(tick, 5 * 60 * 1000);
}

function _vpStationScoped(){
  var base = VP_selectedStation ? VP_allCases.filter(function(c){ return c.station_name === VP_selectedStation; }) : VP_allCases;
  return VP_previewAllowedSet ? base.filter(function(c){ return VP_previewAllowedSet[c.station_name] === 1; }) : base;
}

function vpApplyPreviewLevel(level) {
  if (typeof VP_allCases === 'undefined' || !VP_allCases.length) return;
  var isRealAdmin = !!(window.SPX_ACCESS && window.SPX_ACCESS.role === 'admin');
  var directEntity = (typeof window.SPX_PREVIEW_ENTITY === 'string' && window.SPX_PREVIEW_ENTITY) ? window.SPX_PREVIEW_ENTITY : '';

  if (!isRealAdmin || !level || level === 'admin') {
    if (VP_previewAllowedStations !== null || VP_previewEntityLabel !== null) {
      VP_previewAllowedStations = null; VP_previewAllowedSet = null; VP_previewEntityLabel = null; VP_page = 1; vpRenderMain();
    }
    return;
  }

  if (level === 'lead' || level === 'staff') {
    VP_previewAllowedStations = null;
    VP_previewAllowedSet = null;
    VP_previewEntityLabel = null;
    VP_selectedStation = _vpReadHeaderHub();
    VP_page = 1;
    vpRenderMain();
    return;
  }

  if ((level === 'aom' || level === 'sup' || level === 'rom') && directEntity && typeof spxGetHubsInOrgScope === 'function') {
    var sc = (typeof spxResolvePreviewScope === 'function')
      ? spxResolvePreviewScope(level, directEntity, VP_allCases, function(c){ return c.station_name; }) : null;
    if (!sc) return;
    VP_previewEntityLabel = (level === 'aom' ? 'AOM ' : level === 'rom' ? 'ROM ' : 'SUP ') + directEntity;
    VP_previewAllowedStations = sc.list; VP_previewAllowedSet = sc.set;
    VP_page = 1;
    vpRenderMain();
    return;
  }
}

function _vpFilteredRows(){
  var f = VP_filters || {};
  var q = (VP_searchText || '').toLowerCase().trim();
  var targetOrderType = f.order_type || f.orderType || 'ALL';
  var targetReason = f.last_onhold_reason || f.reason || 'ALL';
  var targetDriver = f.driver_name || f.driver || 'ALL';
  var targetAom = f.aom || 'ALL';
  var targetMonth = (f.month != null && f.month !== 'ALL') ? String(f.month) : 'ALL';
  var targetWeek = (f.week != null && f.week !== 'ALL') ? String(f.week) : 'ALL';

  return _vpStationScoped().filter(function(c){
    if (VP_activeLevel1 !== 'ALL' && (c.level1_case_category_name || 'Không rõ') !== VP_activeLevel1) return false;
    if (targetMonth !== 'ALL' && String(c.month) !== targetMonth) return false;
    if (targetWeek !== 'ALL' && String(c.week) !== targetWeek) return false;
    if (targetAom !== 'ALL' && (c.aom || 'Không rõ') !== targetAom) return false;
    if (targetOrderType !== 'ALL' && (c.order_type || 'Không rõ') !== targetOrderType) return false;
    if (targetReason !== 'ALL' && (c.last_onhold_reason || 'Không rõ') !== targetReason) return false;
    if (targetDriver !== 'ALL' && (c.driver_name || 'Không rõ') !== targetDriver) return false;
    if (f.hasTicket && !c.ticket_no) return false;
    if (q) {
      var match = (c.case_id && c.case_id.toLowerCase().indexOf(q) !== -1) ||
                  (c.order_shipping_id && c.order_shipping_id.toLowerCase().indexOf(q) !== -1) ||
                  (c.station_name && c.station_name.toLowerCase().indexOf(q) !== -1) ||
                  (c.driver_name && c.driver_name.toLowerCase().indexOf(q) !== -1) ||
                  (c.driver_id && String(c.driver_id).toLowerCase().indexOf(q) !== -1) ||
                  (c.ticket_no && c.ticket_no.toLowerCase().indexOf(q) !== -1) ||
                  (c.last_onhold_reason && c.last_onhold_reason.toLowerCase().indexOf(q) !== -1) ||
                  (c.level2_case_category_name && c.level2_case_category_name.toLowerCase().indexOf(q) !== -1) ||
                  (c.level3_case_category_name && c.level3_case_category_name.toLowerCase().indexOf(q) !== -1);
      if (!match) return false;
    }
    return true;
  });
}

function _vpUniqueSorted(list){
  var seen = {}, out = [];
  list.forEach(function(v){ var k = v || 'Không rõ'; if (!seen[k]) { seen[k] = true; out.push(k); } });
  return out.sort();
}

function vpSetFilter(key, val){
  VP_filters[key] = val;
  if (key === 'order_type') VP_filters.orderType = val;
  if (key === 'orderType') VP_filters.order_type = val;
  if (key === 'last_onhold_reason') VP_filters.reason = val;
  if (key === 'reason') VP_filters.last_onhold_reason = val;
  if (key === 'driver_name') VP_filters.driver = val;
  if (key === 'driver') VP_filters.driver_name = val;
  VP_page = 1;
  vpRenderMain();
}
function vpResetFilters(){
  VP_filters = {
    month: 'ALL',
    week: 'ALL',
    aom: 'ALL',
    order_type: 'ALL',

    last_onhold_reason: 'ALL',
    reason: 'ALL',

}

function vpRenderKPI(){
  var kpiGrid = document.getElementById('vp-kpi-grid');
  if (!kpiGrid) return;
  var rows = _vpFilteredRows();
  var stations = new Set(rows.map(function(r){ return r.station_name; }).filter(Boolean));
  var drivers = new Set(rows.map(function(r){ return r.driver_id; }).filter(Boolean));
  var withTicket = rows.filter(function(r){ return !!r.ticket_no; }).length;
  var ticketPct = rows.length ? Math.round(withTicket / rows.length * 100) : 0;
  
  var byLevel1 = {}, byAom = {}, byStation2 = {}, byDriver = {}, byWeek = {};
  rows.forEach(function(c){
    byLevel1[c.level1_case_category_name || 'Không rõ'] = (byLevel1[c.level1_case_category_name || 'Không rõ']||0) + 1;
    byAom[c.aom || 'Không rõ'] = (byAom[c.aom || 'Không rõ']||0) + 1;
    if (c.station_name) byStation2[c.station_name] = (byStation2[c.station_name]||0) + 1;
    if (c.driver_name) byDriver[c.driver_name] = (byDriver[c.driver_name]||0) + 1;
    if (c.week) byWeek[c.week] = (byWeek[c.week]||0) + 1;
  });

  // Trend tuần gần nhất vs tuần trước
  var wks = Object.keys(byWeek).map(Number).sort(function(a,b){ return a-b; });
  var lastW = wks.length ? wks[wks.length - 1] : 0;
  var prevW = wks.length > 1 ? wks[wks.length - 2] : 0;
  var cntLast = lastW ? (byWeek[lastW] || 0) : 0;
  var cntPrev = prevW ? (byWeek[prevW] || 0) : cntLast;
  var dWeek = cntPrev ? Math.round((cntLast - cntPrev) / cntPrev * 100) : 0;
  var weekWorse = dWeek > 0;

  // Danh sách tài xế lặp lại (>=3 vụ)
  var repeatDriversList = Object.keys(byDriver).filter(function(d){ return byDriver[d] >= 3; });

  // Nhóm Cấp 1
  var topL1 = Object.keys(byLevel1).sort(function(a,b){ return byLevel1[b]-byLevel1[a]; })[0];
  var topL1Count = topL1 ? byLevel1[topL1] : 0;
  var topL1Pct = (rows.length && topL1Count) ? Math.round(topL1Count / rows.length * 100) : 0;
  
  // Card 6: Trạm nhiều vụ nhất (hoặc AOM nhiều vụ nhất)
  var lastCardLabel, lastCardVal, lastCardSub, lastCardAction;
  if (VP_previewEntityLabel) {
    var topStation2 = Object.keys(byStation2).sort(function(a,b){ return byStation2[b]-byStation2[a]; })[0];
    var topStCount = topStation2 ? byStation2[topStation2] : 0;
    var topStPct = (rows.length && topStCount) ? Math.round(topStCount / rows.length * 100) : 0;
    lastCardLabel = vpT('Trạm nhiều vụ nhất');
    lastCardVal = topStation2 || '—';
    lastCardSub = topStation2 ? (topStCount.toLocaleString() + ' ' + vpT('vụ') + ' (' + topStPct + '% ' + vpT('toàn cụm') + ')') : '';
    lastCardAction = topStation2 ? 'vpDrillDownStation(\'' + _vpEscAttr(topStation2) + '\')' : '';
  } else {
    var topAom = Object.keys(byAom).sort(function(a,b){ return byAom[b]-byAom[a]; })[0];
    var topAomCount = topAom ? byAom[topAom] : 0;
    var topAomPct = (rows.length && topAomCount) ? Math.round(topAomCount / rows.length * 100) : 0;
    lastCardLabel = vpT('AOM nhiều vụ nhất');
    lastCardVal = topAom || '—';
    lastCardSub = topAom ? (topAomCount.toLocaleString() + ' ' + vpT('vụ') + ' (' + topAomPct + '% ' + vpT('toàn miền') + ')') : '';
    lastCardAction = topAom ? 'vpDrillDownAOM(\'' + _vpEscAttr(topAom) + '\')' : '';
  }

  // Subtitle & Badges tích hợp dữ liệu nhận định
  var card1Sub = lastW 
    ? ('T' + lastW + ': ' + cntLast + ' ' + vpT('vụ') + ' (' + (weekWorse ? '▲ +' + dWeek : '▼ ' + dWeek) + '%)')
    : vpT('Bấm để xem tất cả');
  var card1Badge = lastW 
    ? (weekWorse ? '<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-rose-100 dark:bg-rose-900/40 text-rose-600 dark:text-rose-400">▲ +' + dWeek + '%</span>' 
                 : '<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400">▼ ' + dWeek + '%</span>')
    : '';

  var card2Sub = stations.size ? (stations.size + ' ' + vpT('bưu cục trong phạm vi')) : vpT('Bấm để lọc theo trạm');

  var card3Sub = repeatDriversList.length 
    ? ('<span class="text-amber-600 dark:text-amber-400 font-bold">' + repeatDriversList.length + ' ' + vpT('rider lặp lại ≥3 vụ') + '</span>')
    : vpT('Rider có khiếu nại');
  var card3Badge = repeatDriversList.length 
    ? '<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300">≥3: ' + repeatDriversList.length + '</span>'
    : '';

  var card4Sub = rows.length ? (withTicket.toLocaleString() + '/' + rows.length.toLocaleString() + ' ' + vpT('vụ có Ticket')) : vpT('0 vụ có Ticket');

  var card5Sub = topL1 ? (topL1Count.toLocaleString() + ' ' + vpT('vụ') + ' (' + topL1Pct + '%)') : '';

  var cards = [
    { label: vpT('Tổng vụ việc'), val: rows.length.toLocaleString(), sub: card1Sub, badge: card1Badge, icon: 'fa-layer-group', color: 'orange', action: 'vpResetFilters()' },
    { label: vpT('Bưu cục liên quan'), val: stations.size.toLocaleString(), sub: card2Sub, badge: '', icon: 'fa-warehouse', color: 'sky', action: 'document.getElementById(\'vp-breakdown-card\')?.scrollIntoView({behavior:\'smooth\'})' },
    { label: vpT('Tài xế liên quan'), val: drivers.size.toLocaleString(), sub: card3Sub, badge: card3Badge, icon: 'fa-motorcycle', color: 'violet', action: 'document.getElementById(\'vp-drivers-card\')?.scrollIntoView({behavior:\'smooth\'})' },
    { label: vpT('Tỉ lệ có Ticket'), val: ticketPct + '%', sub: card4Sub, badge: '', icon: 'fa-ticket', color: 'emerald', action: 'vpDrillDownTicket(true)' },
    { label: vpT('Nhóm Cấp 1 lớn nhất'), val: topL1 || '—', sub: card5Sub, badge: '', icon: 'fa-folder-tree', color: 'indigo', action: topL1 ? 'vpSetLevel1(\'' + _vpEscAttr(topL1) + '\')' : '' },
    { label: lastCardLabel, val: lastCardVal, sub: lastCardSub, badge: '', icon: 'fa-fire', color: 'rose', action: lastCardAction }
  ];

  var iconColorMap = {
    orange: 'text-[#ee4d2d] bg-orange-100 dark:bg-orange-950/40',
    sky: 'text-sky-600 bg-sky-100 dark:bg-sky-950/40',
    violet: 'text-violet-600 bg-violet-100 dark:bg-violet-950/40',
    emerald: 'text-emerald-600 bg-emerald-100 dark:bg-emerald-950/40',
    indigo: 'text-indigo-600 bg-indigo-100 dark:bg-indigo-950/40',
    rose: 'text-rose-600 bg-rose-100 dark:bg-rose-950/40'
  };

  kpiGrid.innerHTML = cards.map(function(c){
    var iconCls = iconColorMap[c.color] || iconColorMap.orange;
    var clickAttr = c.action ? 'onclick="' + c.action + '" title="' + vpT('Click để xem chi tiết') + '"' : '';
    return '<div class="vp-kpi-card vp-kpi-' + c.color + '" ' + clickAttr + '>' +
      '<div class="flex items-center justify-between mb-2">' +
      '  <span class="text-[11px] font-black uppercase tracking-wider text-slate-600 dark:text-slate-400 truncate pr-1">' + c.label + '</span>' +
      '  <div class="flex items-center gap-1.5">' +
      (c.badge ? c.badge : '') +
      '    <div class="w-7 h-7 rounded-lg ' + iconCls + ' flex items-center justify-center text-xs shrink-0"><i class="fas ' + c.icon + '"></i></div>' +
      '  </div>' +
      '</div>' +
      '<div class="text-xl font-black tracking-tight text-slate-900 dark:text-white truncate font-mono">' + c.val + '</div>' +
      '<div class="text-[11px] text-slate-500 dark:text-slate-400 font-medium truncate mt-1 flex items-center justify-between">' +
      '  <span class="truncate">' + (c.sub || '') + '</span>' +
      '  <i class="fas fa-chevron-right text-[8px] opacity-40 shrink-0 ml-1"></i>' +
      '</div>' +
      '</div>';
  }).join('');
}

function _vpPct(v){ return (v * 100).toFixed(3) + '%'; }



function vpRenderBigPicture(){
  var el = document.getElementById('vp-bigpicture');
  if (!el) return;

  var rows = _vpStationScoped();
  if (!rows.length) { el.innerHTML = ''; return; }

  // ── Tổng hợp 1 lượt ──
  var byAom = {}, byStation = {}, byL2 = {}, byReason = {}, byDriver = {}, byMonth = {}, byWeek = {};
  var withTicketCount = 0;
  rows.forEach(function(c){
    byAom[c.aom || 'Không rõ'] = (byAom[c.aom || 'Không rõ'] || 0) + 1;
    if (c.station_name) byStation[c.station_name] = (byStation[c.station_name] || 0) + 1;
    byL2[c.level2_case_category_name || 'Không rõ'] = (byL2[c.level2_case_category_name || 'Không rõ'] || 0) + 1;
    var rs = c.last_onhold_reason || c.mapping_reason || 'Không rõ';
    byReason[rs] = (byReason[rs] || 0) + 1;
    if (c.driver_name) byDriver[c.driver_name] = (byDriver[c.driver_name] || 0) + 1;
    if (c.month) byMonth[c.month] = (byMonth[c.month] || 0) + 1;
    if (c.week) byWeek[c.week] = (byWeek[c.week] || 0) + 1;
    if (c.ticket_no) withTicketCount++;
  });
  var total = rows.length;
  var sortDesc = function(o){ return Object.keys(o).sort(function(a,b){ return o[b]-o[a]; }); };
  var stationsList = Object.keys(byStation);

  var isHubScope = !!VP_selectedStation || stationsList.length === 1;
  var isAomScope = !isHubScope && !!VP_previewEntityLabel && (VP_previewEntityLabel.indexOf('AOM') !== -1 || VP_previewEntityLabel.indexOf('SUP') !== -1);
  var isRegionScope = !isHubScope && !isAomScope;
  var isAomView = isAomScope;

  // ── 1. DIỄN BIẾN THEO TUẦN & TÀI XẾ RỦI RO ──
  var wks = Object.keys(byWeek).map(Number).sort(function(a,b){ return a-b; });
  var repeatDriversList = sortDesc(byDriver).filter(function(d){ return byDriver[d] >= 3; });

  // ── 2. BIỂU ĐỒ DIỄN BIẾN THEO TUẦN & LŨY TIẾN THEO THÁNG ──
  var trendHtml = '';
  if (wks.length >= 3) {
    var wMax = Math.max.apply(null, wks.map(function(w){ return byWeek[w]; }));
    var last3 = wks.slice(-3), prev3 = wks.slice(-6, -3);
    var avgL = last3.reduce(function(s,w){ return s+byWeek[w]; },0)/(last3.length||1);
    var avgP = prev3.length ? prev3.reduce(function(s,w){ return s+byWeek[w]; },0)/prev3.length : avgL;
    var accel = avgP ? ((avgL-avgP)/avgP*100) : 0;
    var accUp = accel > 5, accDown = accel < -5;
    var accCls = accUp ? 'vp-pill-badge-rose' : (accDown ? 'vp-pill-badge-emerald' : 'vp-pill-badge-slate');
    var accTxt = accUp ? '▲ ' + vpT('Đang tăng tốc') + ' +' + accel.toFixed(0) + '%' : (accDown ? '▼ ' + vpT('Đang dịu đi') + ' ' + accel.toFixed(0) + '%' : '● ' + vpT('Đi ngang ổn định'));

    var bars = wks.map(function(w){
      var n = byWeek[w], h = Math.max(8, Math.round(n/wMax*60));
      var isLast3 = last3.indexOf(w) !== -1;
      var barCls = isLast3 ? 'recent' : 'normal';
      return '<div class="vp-chart-bar-container group" onclick="vpDrillDownWeek(' + w + ')" title="' + vpT('Tuần') + ' ' + w + ': ' + n.toLocaleString() + ' ' + vpT('vụ — Bấm để lọc chi tiết') + '">' +
        '<div class="vp-chart-bar ' + barCls + '" style="height:' + h + 'px"></div>' +
        '<span style="font-size:10px;font-weight:700;color:#64748b;" class="group-hover:text-[#ee4d2d] transition-colors">' + w + '</span></div>';
    }).join('');

    var mks = Object.keys(byMonth).map(Number).sort(function(a,b){ return a-b; });
    var monthHtml = mks.map(function(m){
      var prev = byMonth[m-1];
      var d = (prev != null) ? ((byMonth[m]-prev)/prev*100) : null;
      var dCls = d == null ? 'text-slate-400' : (d > 0 ? 'text-rose-600 dark:text-rose-400 font-bold' : 'text-emerald-600 dark:text-emerald-400 font-bold');
      return '<div class="vp-month-card" onclick="vpDrillDownMonth(' + m + ')" title="' + vpT('Tháng') + ' ' + m + ': ' + byMonth[m].toLocaleString() + ' ' + vpT('vụ — Bấm để lọc chi tiết') + '">' +
        '<div style="font-size:10.5px;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:2px;">' + vpT('Tháng') + ' ' + m + '</div>' +
        '<div style="font-size:17px;font-weight:900;font-family:ui-monospace,monospace;color:#0f172a;" class="dark:text-white">' + byMonth[m].toLocaleString() + '</div>' +
        (d == null ? '<div style="font-size:10px;color:#94a3b8;font-weight:bold;">—</div>' : '<div class="' + dCls + '" style="font-size:11px;">' + (d>0?'▲ +':'▼ ') + Math.abs(d).toFixed(1) + '%</div>') +
        '</div>';
    }).join('');

    trendHtml = '<div class="vp-card">' +
      '<div class="vp-card-header">' +
        '<div class="vp-card-title">' +
          '<i class="fas fa-chart-column text-[#ee4d2d]"></i>' +
          '<span>' + vpT('Diễn biến theo tuần') + ' (' + vpT('Tuần') + ' ' + wks[0] + ' – ' + wks[wks.length-1] + ')</span>' +
          '<span class="text-[10px] text-slate-500 font-normal">(' + vpT('Bấm vào cột/tháng để lọc') + ')</span>' +
        '</div>' +
        '<span class="vp-pill-badge ' + accCls + '">' + accTxt + ' <span class="font-normal opacity-80">' + vpT('(3 tuần gần nhất vs 3 tuần trước)') + '</span></span>' +
      '</div>' +
      '<div class="vp-card-body">' +
        '<div class="flex items-end gap-2 h-20 pt-2 pb-1 border-b border-dashed border-slate-200 dark:border-slate-800">' + bars + '</div>' +
      '</div>' +
      (monthHtml ? '<div class="vp-month-grid">' + monthHtml + '</div>' : '') +
      '</div>';
  }

  // ── 3. BẢNG XẾP HẠNG ĐƠN VỊ CẤP DƯỚI (DRILL-DOWN ONCLICK TRẠM / AOM) ──
  var cmpHtml = '';
  if (isRegionScope) {
    var allR = Object.keys(VP_AOM_RATE).map(function(k){ return VP_AOM_RATE[k]; });
    var avgNow = allR.length ? (allR.reduce(function(s,v){ return s+v.m9; },0)/allR.length) : 0;
    var names = Object.keys(byAom).filter(function(a){ return VP_AOM_RATE[a]; })
      .sort(function(a,b){ return VP_AOM_RATE[b].m9 - VP_AOM_RATE[a].m9; });
    if (names.length) {
      var rowsHtmlAom = names.map(function(a, idx){
        var r = VP_AOM_RATE[a], d = r.m9 - r.m8, w = d > 0;
        var dp = r.m8 ? Math.abs(d/r.m8*100).toFixed(1) : '0.0';
        var share = Math.round((byAom[a]||0)/total*100);
        return '<tr class="cursor-pointer group transition-colors" onclick="vpDrillDownAOM(\'' + _vpEscAttr(a) + '\')" title="' + vpT('Bấm để lọc chi tiết các vụ của AOM') + ' ' + _vpEscAttr(a) + '">' +
          '<td class="font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">' +
            '<span class="w-5 text-center font-mono text-[11px] font-bold text-slate-500">#' + (idx+1) + '</span>' +
            '<span class="group-hover:text-[#ee4d2d] transition-colors">' + _vpEsc(a) + '</span>' +
            (r.m9 > avgNow ? ' <span class="vp-pill-badge vp-pill-badge-rose text-[9px] font-black">' + vpT('TRÊN TB') + '</span>' : '') + '</td>' +
          '<td class="text-center font-black font-mono ' + (r.m9>avgNow?'text-rose-600 dark:text-rose-400':'text-slate-900 dark:text-slate-100') + '">' + _vpPct(r.m9) + '</td>' +
          '<td class="text-center font-bold ' + (w?'text-rose-600 dark:text-rose-400':(d<0?'text-emerald-600 dark:text-emerald-400':'text-slate-500')) + '">' + (w?'▲ +':'▼ -') + dp + '%</td>' +
          '<td class="text-center font-mono font-bold text-slate-700 dark:text-slate-300">' + share + '%</td></tr>';
      }).join('');

      cmpHtml = '<div class="vp-card" id="vp-breakdown-card">' +
        '<div class="vp-card-header">' +
          '<div class="vp-card-title">' +
            '<i class="fas fa-chart-line text-[#ee4d2d]"></i>' +
            '<span>' + vpT('7 AOM — % CS Contact Rate (Tháng 9)') + '</span>' +
            '<span class="text-[10px] text-slate-500 font-normal">(' + vpT('Bấm dòng để lọc chi tiết') + ')</span>' +
          '</div>' +
          '<span class="vp-pill-badge vp-pill-badge-slate font-bold">' + vpT('Rate TĂNG = Xấu đi · TB miền:') + ' <b>' + _vpPct(avgNow) + '</b></span>' +
        '</div>' +
        '<div class="p-0">' +
          '<div class="vp-table-wrap border-0 rounded-none">' +
            '<table class="vp-table"><thead><tr>' +
            '<th class="w-1/3">AOM</th><th class="text-center">Contact Rate (T9)</th><th class="text-center">Xu hướng</th><th class="text-center">% Vụ toàn miền</th>' +
            '</tr></thead><tbody>' + rowsHtmlAom + '</tbody></table>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
  } else {
    var st = sortDesc(byStation).slice(0, 10);
    if (st.length) {
      var stMax = byStation[st[0]] || 1;
      var rowsHtmlStation = st.map(function(s, idx){
        var n = byStation[s], share = Math.round(n/total*100);
        var rankBadgeCls = idx === 0 ? 'bg-rose-500 text-white font-black' : (idx === 1 ? 'bg-amber-500 text-white font-black' : (idx === 2 ? 'bg-orange-500 text-white font-black' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold'));
        var barCls = share >= 20 ? 'vp-bar-critical' : 'vp-bar-warning';
        return '<tr class="cursor-pointer group transition-colors" onclick="vpDrillDownStation(\'' + _vpEscAttr(s) + '\')" title="' + vpT('Bấm để lọc chi tiết tất cả các vụ của trạm') + ' ' + _vpEscAttr(s) + '">' +
          '<td class="w-8"><span class="w-5 h-5 rounded-full inline-flex items-center justify-center text-[10px] ' + rankBadgeCls + '">' + (idx+1) + '</span></td>' +
          '<td class="font-bold text-slate-900 dark:text-slate-100"><div class="flex items-center gap-1.5"><i class="fas fa-warehouse text-slate-400 group-hover:text-[#ee4d2d] transition-colors text-xs"></i><span class="group-hover:text-[#ee4d2d] transition-colors">' + _vpEsc(s) + '</span></div></td>' +
          '<td style="width:38%;"><div class="vp-progress-track"><div class="vp-progress-bar ' + barCls + '" style="width:' + Math.round(n/stMax*100) + '%"></div></div></td>' +
          '<td class="text-center font-black font-mono text-slate-900 dark:text-slate-100">' + n.toLocaleString() + '</td>' +
          '<td class="text-center">' +
            (share >= 20
              ? '<span class="vp-pill-badge vp-pill-badge-rose"><span class="vp-pulse-dot bg-rose-500"></span>' + share + '%</span>'
              : '<span class="vp-pill-badge vp-pill-badge-slate font-mono">' + share + '%</span>') +
            '<i class="fas fa-arrow-right text-[10px] text-slate-400 opacity-0 group-hover:opacity-100 group-hover:text-[#ee4d2d] transition-all ml-1.5"></i>' +
          '</td></tr>';
      }).join('');

      cmpHtml = '<div class="vp-card" id="vp-breakdown-card">' +
        '<div class="vp-card-header">' +
          '<div class="vp-card-title">' +
            '<i class="fas fa-ranking-star text-amber-500"></i>' +
            '<span>' + vpT('Trạm Cần Chú Ý Nhất Trong Vùng') + '</span>' +
            '<span class="text-[10px] text-slate-500 font-normal">(' + vpT('Bấm dòng để mở danh sách vụ của trạm') + ')</span>' +
          '</div>' +
          '<span class="vp-pill-badge vp-pill-badge-slate font-bold">' + stationsList.length + ' ' + vpT('trạm') + ' · ' + total.toLocaleString() + ' ' + vpT('vụ') + '</span>' +
        '</div>' +
        '<div class="p-0">' +
          '<div class="vp-table-wrap border-0 rounded-none">' +
            '<table class="vp-table"><thead><tr>' +
            '<th class="w-10">#</th><th>' + vpT('Bưu cục / Trạm') + '</th><th>' + vpT('Tỉ trọng so với trạm cao nhất') + '</th><th class="text-center">' + vpT('Số vụ') + '</th><th class="text-center">' + vpT('% Vùng') + '</th>' +
            '</tr></thead><tbody>' + rowsHtmlStation + '</tbody></table>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
  }

  // ── 4. 2 CỘT INSIGHTS: TOP NGUYÊN NHÂN & TÀI XẾ LẶP LẠI (2 Ô RIÊNG BIỆT) ──
  var topR = sortDesc(byReason).slice(0, 5);
  var reasonHtml = topR.length ? topR.map(function(r, idx){
    var shareR = Math.round(byReason[r]/total*100);
    return '<div class="mb-3 last:mb-0 p-2.5 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors cursor-pointer group border border-slate-100 dark:border-slate-800" onclick="vpDrillDownReason(\'' + _vpEscAttr(r) + '\')" title="' + vpT('Bấm để lọc các vụ do nguyên nhân:') + ' ' + _vpEscAttr(r) + '">' +
      '<div class="flex justify-between items-center text-xs font-bold text-slate-800 dark:text-slate-100 mb-1.5">' +
      '  <span class="truncate pr-2 flex items-center gap-2"><span class="w-4 text-[11px] font-mono font-bold text-slate-400">#' + (idx+1) + '</span><span class="group-hover:text-[#ee4d2d] transition-colors">' + _vpEsc(r) + '</span></span>' +
      '  <span class="font-mono text-xs font-bold text-slate-900 dark:text-slate-100 shrink-0">' + byReason[r].toLocaleString() + ' <span class="text-[10px] text-slate-500 font-normal">(' + shareR + '%)</span></span>' +
      '</div>' +
      '<div class="vp-progress-track"><div class="vp-progress-bar vp-bar-rose" style="width:' + shareR + '%"></div></div>' +
      '</div>';
  }).join('') : '<div class="text-xs text-slate-400 py-6 text-center">' + vpT('Không có dữ liệu nguyên nhân.') + '</div>';

  var repeat = repeatDriversList.slice(0, 5);
  var driverHtml = repeat.length ? repeat.map(function(d){
    var initials = d.split(' ').filter(Boolean).map(function(w){ return w[0]; }).slice(-2).join('').toUpperCase() || 'TX';
    return '<div class="flex justify-between items-center p-2.5 mb-2 last:mb-0 rounded-xl hover:bg-amber-50 dark:hover:bg-amber-950/20 border border-slate-200 dark:border-slate-800 cursor-pointer group transition-colors" onclick="vpDrillDownDriver(\'' + _vpEscAttr(d) + '\')" title="' + vpT('Bấm để lọc các vụ do tài xế') + ' ' + _vpEscAttr(d) + ' ' + vpT('thực hiện') + '">' +
      '<div class="flex items-center gap-2.5 min-w-0 pr-2">' +
      '  <div class="w-7 h-7 rounded-full bg-rose-100 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-300 dark:border-rose-800 flex items-center justify-center font-bold text-[10px] shrink-0">' + initials + '</div>' +
      '  <span class="text-xs font-bold text-slate-900 dark:text-slate-100 truncate group-hover:text-[#ee4d2d] transition-colors">' + _vpEsc(d) + '</span>' +
      '</div>' +
      '<span class="vp-pill-badge vp-pill-badge-rose font-black shrink-0">' +
      '  <span class="vp-pulse-dot bg-rose-500"></span>' + byDriver[d] + ' ' + vpT('vụ') +
      '</span>' +
      '</div>';
  }).join('') : '<div class="text-xs text-emerald-600 dark:text-emerald-400 py-6 text-center font-bold flex items-center justify-center gap-2"><i class="fas fa-shield-check text-base"></i>' + vpT('Không có tài xế nào ≥3 vụ — lỗi phân tán, không tập trung cá nhân.') + '</div>';

  var riderPct = Math.round((byL2['Rider behavior']||0)/total*100);
  var twoCol = '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">' +
    '<div class="vp-card mb-0">' +
    '  <div class="vp-card-header">' +
    '    <div class="vp-card-title"><i class="fas fa-triangle-exclamation text-rose-500"></i><span>' + vpT('Top 5 Nguyên Nhân Lớn Nhất') + '</span></div>' +
    '    <span class="text-[11px] text-slate-500 font-bold lowercase">' + vpT('Bấm để lọc') + '</span>' +
    '  </div><div class="vp-card-body">' + reasonHtml + '</div></div>' +
    '<div class="vp-card mb-0" id="vp-drivers-card">' +
    '  <div class="vp-card-header">' +
    '    <div class="vp-card-title"><i class="fas fa-user-clock text-amber-500"></i><span>' + vpT('Tài Xế Khiếu Nại Lặp Lại (≥3 Vụ)') + '</span></div>' +
    '    <span class="text-[11px] text-slate-500 font-bold">' + repeatDriversList.length + ' ' + vpT('tài xế (Bấm xem)') + '</span>' +
    '  </div><div class="vp-card-body">' + driverHtml + '</div></div>' +
    '</div>';

  // ── 5. ACTION CENTER: KHUYẾN NGHỊ HÀNH ĐỘNG DÀNH CHO CẤP QUẢN LÝ ──
  var actItems = [];
  if (isHubScope) {
    // ── Khuyến nghị dành cho cấp Trưởng Bưu Cục (Lead Hub) & Điều Phối Trạm ──
    var topR = sortDesc(byReason)[0];
    var topRCnt = topR ? byReason[topR] : 0;
    var topRPct = total ? Math.round(topRCnt / total * 100) : 0;
    if (topR) {
      actItems.push({
        tag: vpT('VẬN HÀNH TRẠM'),
        tagCls: 'vp-pill-badge-emerald',
        text: vpT('Trưởng bưu cục & Điều phối rà soát nguyên nhân lớn nhất:') + ' <b>' + _vpEsc(topR) + '</b> — ' + vpT('chiếm tới') + ' <b>' + topRPct + '% ' + vpT('số vụ tại bưu cục') + '</b> (' + topRCnt + ' ' + vpT('vụ') + ').',
        action: 'vpDrillDownReason(\'' + _vpEscAttr(topR) + '\')'
      });
    }
    if (repeatDriversList.length > 0) {
      actItems.push({
        tag: vpT('CHẤN CHỈNH TÀI XẾ'),
        tagCls: 'vp-pill-badge-rose',
        text: vpT('Bưu cục có') + ' <b>' + repeatDriversList.length + ' ' + vpT('tài xế khiếu nại lặp lại từ 3 vụ trở lên') + '</b> — ' + vpT('Trưởng bưu cục trực tiếp phỏng vấn và chấn chỉnh danh sách tài xế này.'),
        action: 'document.getElementById(\'vp-drivers-card\')?.scrollIntoView({behavior:\'smooth\'})'
      });
    }
    var noTicketCount = total - withTicketCount;
    if (noTicketCount > 0) {
      var noTicketPct = Math.round(noTicketCount / total * 100);
      actItems.push({
        tag: vpT('XỬ LÝ KHIẾU NẠI'),
        tagCls: 'vp-pill-badge-amber',
        text: vpT('Bưu cục còn') + ' <b>' + noTicketCount + ' ' + vpT('vụ chưa có Ticket') + '</b> (' + noTicketPct + '%) — ' + vpT('đôn đốc nhân viên trạm tạo ticket phối hợp CS giải quyết dứt điểm, tránh rủi ro đền bù.'),
        action: 'vpDrillDownTicket(false)'
      });
    }
  } else if (isAomScope) {
    // ── Khuyến nghị dành cho AOM / SUP (Quản lý cụm bưu cục) ──
    var topSt = sortDesc(byStation)[0];
    var topStShare = topSt ? Math.round(byStation[topSt]/total*100) : 0;
    if (topSt && topStShare >= 20) {
      actItems.push({
        tag: vpT('KIỂM SOÁT BƯU CỤC'),
        tagCls: 'vp-pill-badge-rose',
        text: vpT('Làm việc trực tiếp với Trưởng bưu cục (Lead) của trạm') + ' <b>' + _vpEsc(topSt) + '</b> — ' + vpT('chiếm tới') + ' <b>' + topStShare + '% ' + vpT('tổng số vụ toàn vùng') + '</b> (' + vpT('Bấm để mở danh sách vụ') + ').',
        action: 'vpDrillDownStation(\'' + _vpEscAttr(topSt) + '\')'
      });
    }
    if (repeatDriversList.length > 0) {
      actItems.push({
        tag: vpT('GIÁM SÁT VÙNG'),
        tagCls: 'vp-pill-badge-amber',
        text: '<b>' + repeatDriversList.length + ' ' + vpT('tài xế lặp lại từ 3 vụ trở lên trong vùng') + '</b> — ' + vpT('yêu cầu Lead các bưu cục kiểm tra và báo cáo phương án chấn chỉnh tài xế vi phạm.'),
        action: 'document.getElementById(\'vp-drivers-card\')?.scrollIntoView({behavior:\'smooth\'})'
      });
    }
    if (riderPct >= 25) {
      actItems.push({
        tag: vpT('ĐÀO TẠO RIDER'),
        tagCls: 'vp-pill-badge-violet',
        text: '<b>' + riderPct + '% ' + vpT('vụ do hành vi tài xế (Rider behavior)') + '</b> — ' + vpT('ưu tiên đôn đốc các Lead tăng cường đào tạo và giám sát quy trình giao hàng.'),
        action: 'vpSetLevel1(\'Logistics\')'
      });
    }
  } else {
    // ── Khuyến nghị dành cho Cấp Toàn Miền / Giám Đốc / Admin / ROM ──
    var worst = Object.keys(VP_AOM_RATE).sort(function(a,b){ return (VP_AOM_RATE[b].m9-VP_AOM_RATE[b].m8) - (VP_AOM_RATE[a].m9-VP_AOM_RATE[a].m8); })[0];
    if (worst && VP_AOM_RATE[worst].m9 > VP_AOM_RATE[worst].m8) {
      actItems.push({
        tag: vpT('ĐIỀU HÀNH VÙNG'),
        tagCls: 'vp-pill-badge-sky',
        text: vpT('Làm việc trọng tâm với') + ' <b>' + _vpEsc(worst) + '</b> — ' + vpT('AOM có tỉ lệ khiếu nại tăng mạnh nhất miền') + ' (' + _vpPct(VP_AOM_RATE[worst].m8) + ' → ' + _vpPct(VP_AOM_RATE[worst].m9) + ').',
        action: 'vpDrillDownAOM(\'' + _vpEscAttr(worst) + '\')'
      });
    }
    if (repeatDriversList.length > 0) {
      actItems.push({
        tag: vpT('GIÁM SÁT TOÀN MIỀN'),
        tagCls: 'vp-pill-badge-amber',
        text: '<b>' + repeatDriversList.length + ' ' + vpT('tài xế lặp lại từ 3 vụ trở lên toàn miền') + '</b> — ' + vpT('chỉ đạo các AOM yêu cầu trưởng trạm xử lý nghiêm các trường hợp tái diễn.'),
        action: 'document.getElementById(\'vp-drivers-card\')?.scrollIntoView({behavior:\'smooth\'})'
      });
    }
    if (riderPct >= 25) {
      actItems.push({
        tag: vpT('ĐÀO TẠO RIDER'),
        tagCls: 'vp-pill-badge-violet',
        text: '<b>' + riderPct + '% ' + vpT('vụ do hành vi tài xế (Rider behavior)') + '</b> — ' + vpT('ưu tiên triển khai chương trình chấn chỉnh văn hóa giao hàng cho rider toàn miền.'),
        action: 'vpSetLevel1(\'Logistics\')'
      });
    }
  }

  var actHtml = '';
  if (actItems.length) {
    actHtml = '<div class="vp-action-box shadow-xs">' +
      '<div class="flex items-center justify-between mb-3 pb-2 border-b border-amber-300 dark:border-amber-800/60">' +
        '<div class="vp-action-title">' +
          '<div class="w-6 h-6 rounded-lg bg-amber-500 text-white flex items-center justify-center text-xs font-bold"><i class="fas fa-bolt"></i></div>' +
          '<span>' + vpT('Khuyến nghị hành động dành cho cấp quản lý') + '</span>' +
        '</div>' +
        '<span class="text-[11px] text-amber-800 dark:text-amber-400 font-bold lowercase">' + vpT('Bấm thẻ để kích hoạt hành động') + '</span>' +
      '</div>' +
      '<div class="space-y-2">' +
      actItems.map(function(item){
        var clickAttr = item.action ? 'onclick="' + item.action + '"' : '';
        return '<div class="vp-action-card flex items-start gap-2.5 text-xs text-slate-800 dark:text-slate-100 group" ' + clickAttr + '>' +
          '<span class="vp-pill-badge ' + item.tagCls + ' shrink-0 mt-0.5">' + item.tag + '</span>' +
          '<div class="flex-1 leading-relaxed font-medium">' + item.text + '</div>' +
          '<i class="fas fa-arrow-right text-[10px] text-amber-500 opacity-0 group-hover:opacity-100 transition-opacity mt-1"></i>' +
          '</div>';
      }).join('') +
      '</div></div>';
  }

  el.innerHTML = trendHtml + cmpHtml + twoCol + actHtml;
}

function vpRenderMain(){
  _vpEnsureStyles();
  var titleEl = document.getElementById('vp-scope-title');
  var subtitleEl = document.getElementById('vp-scope-subtitle');
  var rows = _vpStationScoped();

  if (titleEl) {
    if (VP_selectedStation) titleEl.textContent = VP_selectedStation;
    else if (VP_previewEntityLabel) titleEl.textContent = VP_previewEntityLabel;
    else titleEl.textContent = vpT('Tất cả trạm');
  }
  if (subtitleEl) {
    var stCount = new Set(rows.map(function(r){ return r.station_name; }).filter(Boolean)).size;
    subtitleEl.textContent = stCount + ' ' + vpT('bưu cục') + ' · ' + rows.length.toLocaleString() + ' ' + vpT('vụ khiếu nại ghi nhận');
  }

  var bannerEl = document.getElementById('vp-scope-banner');
  if (bannerEl) {
    bannerEl.innerHTML = (VP_previewEntityLabel && !VP_selectedStation)
      ? '<div class="vp-card p-3.5 mb-4 flex items-center justify-between gap-3 bg-sky-50 dark:bg-sky-950/30 border-sky-300 dark:border-sky-800 text-xs text-sky-900 dark:text-sky-200">' +
        '  <div class="flex items-center gap-3">' +
        '    <div class="w-8 h-8 rounded-xl bg-sky-500 text-white flex items-center justify-center font-bold text-sm shrink-0"><i class="fas fa-eye"></i></div>' +
        '    <div>' +
        '      <div class="font-bold text-sm text-sky-950 dark:text-sky-100">' + vpT('Đang xem đúng góc nhìn của') + ' <b>' + _vpEsc(VP_previewEntityLabel) + '</b></div>' +
        '      <div class="text-[11px] text-sky-700 dark:text-sky-300 font-medium">' + vpT('Bảng dữ liệu và chỉ số tự động thu hẹp theo các trạm thuộc quyền quản lý.') + '</div>' +
        '    </div>' +
        '  </div>' +
        '</div>'
      : '';
  }

  try { vpRenderFreshness(); } catch(e){ console.error('vpRenderFreshness error:', e); }
  try { vpRenderLevel1Tabs(); } catch(e){ console.error('vpRenderLevel1Tabs error:', e); }
  try { vpRenderKPI(); } catch(e){ console.error('vpRenderKPI error:', e); }
  try { vpRenderBigPicture(); } catch(e){ console.error('vpRenderBigPicture error:', e); }
  try { vpRenderFilterBar(); } catch(e){ console.error('vpRenderFilterBar error:', e); }
  try { vpRenderTable(); } catch(e){ console.error('vpRenderTable error:', e); }
}

function vpRenderTable(){
  var rows = _vpFilteredRows();
  var wrap = document.getElementById('vp-table-wrap');
  var badgeEl = document.getElementById('vp-table-count-badge');
  if (badgeEl) {
    badgeEl.textContent = rows.length.toLocaleString() + ' ' + vpT('vụ việc');
  }
  if (!wrap) return;

  if (!rows.length) {
    wrap.innerHTML = '<div class="vp-empty-state text-slate-400">' +
      '<div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center text-xl mb-1">' +
      '  <i class="fas fa-folder-open"></i>' +
      '</div>' +
      '<div class="text-sm font-bold text-slate-700 dark:text-slate-200">' + vpT('Không có vụ việc nào phù hợp với bộ lọc hiện tại.') + '</div>' +
      '<div class="text-xs text-slate-400">' + vpT('Vui lòng thử điều chỉnh bộ lọc hoặc xóa ô tìm kiếm.') + '</div>' +
      '</div>';
    return;
  }

  var totalPages = Math.max(1, Math.ceil(rows.length / VP_PAGE_SIZE));
  if (VP_page > totalPages) VP_page = totalPages;
  var start = (VP_page - 1) * VP_PAGE_SIZE;
  var pageRows = rows.slice(start, start + VP_PAGE_SIZE);

  var tableHtml = '<div class="overflow-x-auto"><table class="vp-table"><thead><tr>' +
    '<th>Case ID</th>' +
    '<th>' + vpT('Ngày tạo') + '</th>' +
    '<th>' + vpT('Bưu cục') + '</th>' +
    '<th>' + vpT('Cấp 1') + '</th>' +
    '<th>' + vpT('Cấp 2') + '</th>' +
    '<th>' + vpT('Cấp 3') + '</th>' +
    '<th>' + vpT('Mã vận đơn') + '</th>' +
    '<th>' + vpT('Tài xế') + '</th>' +
    '<th class="text-center">' + vpT('Ticket') + '</th>' +
    '</tr></thead><tbody>' +
    pageRows.map(function(c){
      return '<tr>' +
        '<td class="font-mono font-bold text-slate-900 dark:text-slate-100 cursor-pointer hover:text-[#ee4d2d] transition-colors group" onclick="event.stopPropagation(); vpCopyCode(\'' + _vpEscAttr(c.case_id) + '\')" title="' + vpT('Click để copy Case ID') + '">' +
          _vpEsc(c.case_id) + '<i class="fas fa-copy ml-1.5 opacity-0 group-hover:opacity-60 text-[10px] transition-opacity"></i>' +
        '</td>' +
        '<td class="text-slate-600 dark:text-slate-400 whitespace-nowrap">' +
          _vpEsc(c.case_create_date) + (c.case_create_time && String(c.case_create_time).length >= 16 ? ' <span class="font-mono text-[10px] text-slate-400">' + _vpEsc(String(c.case_create_time).slice(11, 16)) + '</span>' : '') +
        '</td>' +
        '<td class="font-bold text-slate-900 dark:text-slate-100 whitespace-nowrap">' + _vpEsc(c.station_name) + '</td>' +
        '<td><span class="vp-pill-badge vp-pill-badge-slate font-bold">' + _vpEsc(c.level1_case_category_name) + '</span></td>' +
        '<td class="text-slate-700 dark:text-slate-300 max-w-xs truncate" title="' + _vpEscAttr(c.level2_case_category_name) + '">' + _vpEsc(c.level2_case_category_name) + '</td>' +
        '<td class="text-slate-600 dark:text-slate-400 max-w-xs truncate" title="' + _vpEscAttr(c.level3_case_category_name) + '">' + _vpEsc(c.level3_case_category_name) + '</td>' +
        '<td class="font-mono text-slate-700 dark:text-slate-300">' + (_vpEsc(c.spx_tracking_id) || '—') + '</td>' +
        '<td class="font-bold text-slate-900 dark:text-slate-100 whitespace-nowrap">' + (_vpEsc(c.driver_name) || '—') + '</td>' +
        '<td class="text-center">' +
          (c.ticket_no
            ? '<span class="vp-pill-badge vp-pill-badge-emerald font-mono font-bold">' + _vpEsc(c.ticket_no) + '</span>'
            : '<span class="text-slate-400 font-bold">—</span>') +
        '</td>' +
      '</tr>';
    }).join('') +
    '</tbody></table></div>';

  var pagHtml = '<div class="p-3.5 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between flex-wrap gap-2 text-xs text-slate-600 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/40">' +
    '<div>' + vpT('Hiển thị') + ' <b>' + (start + 1) + ' - ' + Math.min(rows.length, start + VP_PAGE_SIZE) + '</b> ' + vpT('trên') + ' <b>' + rows.length.toLocaleString() + '</b> ' + vpT('vụ') + '</div>' +
    '<div class="flex items-center gap-2">' +
      '<button class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-100 text-slate-700 dark:text-slate-200 disabled:opacity-40 disabled:pointer-events-none font-bold transition-colors cursor-pointer" ' + (VP_page <= 1 ? 'disabled' : '') + ' onclick="vpGoPage(' + (VP_page - 1) + ')">' +
        '<i class="fas fa-chevron-left mr-1"></i>' + vpT('Trước') +
      '</button>' +
      '<span class="font-mono px-2 font-black text-slate-900 dark:text-slate-100">' + VP_page + ' / ' + totalPages + '</span>' +
      '<button class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-100 text-slate-700 dark:text-slate-200 disabled:opacity-40 disabled:pointer-events-none font-bold transition-colors cursor-pointer" ' + (VP_page >= totalPages ? 'disabled' : '') + ' onclick="vpGoPage(' + (VP_page + 1) + ')">' +
        vpT('Sau') + '<i class="fas fa-chevron-right ml-1"></i>' +
      '</button>' +
    '</div>' +
  '</div>';

  wrap.innerHTML = tableHtml + pagHtml;
}

function vpGoPage(p){
  VP_page = p;
  vpRenderTable();
}

function vpCopyCode(text) {
  var done = function() { if (typeof showToast === 'function') showToast('✓ ' + vpT('Đã copy') + ': ' + text, 'success'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function() { _vpCopyFallback(text, done); });
  } else {
    _vpCopyFallback(text, done);
  }
}

function _vpCopyFallback(text, cb) {
  if (typeof spxCopyFallback === 'function') spxCopyFallback(text, cb);
}

vpInit();

</script>
