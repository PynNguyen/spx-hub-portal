<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPX Hub Portal - Đăng Nhập Google Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .spx-gradient { background: linear-gradient(135deg, #ee4d2d 0%, #ff5722 50%, #f53d2d 100%); }
    .card-shadow { box-shadow: 0 20px 40px -15px rgba(238, 77, 45, 0.15), 0 0 20px rgba(0, 0, 0, 0.05); }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl p-8 card-shadow border border-slate-100 relative overflow-hidden">
    <!-- Top colored bar -->
    <div class="absolute top-0 left-0 right-0 h-2 spx-gradient"></div>

    <!-- Header Logo & Branding -->
    <div class="text-center mb-8 pt-2">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-50 text-[#ee4d2d] mb-4 shadow-inner">
        <i class="fas fa-boxes-packing text-3xl"></i>
      </div>
      <div class="flex items-center justify-center gap-2 mb-1">
        <span class="text-2xl font-black tracking-tight text-[#ee4d2d]">SPX</span>
        <span class="text-2xl font-black tracking-tight text-slate-800">HUB PORTAL</span>
      </div>
      <p class="text-xs font-bold uppercase tracking-wider text-slate-400">FirstMile & LastMile Assistant</p>
      <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 bg-emerald-50 text-emerald-600 rounded-full text-[11px] font-bold border border-emerald-100">
        <i class="fas fa-shield-halved text-xs"></i> Google Workspace SSO Enterprise
      </div>
    </div>

    <!-- Notice -->
    <div class="mb-6 p-3.5 bg-orange-50/70 border border-orange-100 rounded-2xl text-[12px] text-slate-600 leading-relaxed">
      <div class="flex items-start gap-2">
        <i class="fas fa-info-circle text-[#ee4d2d] mt-0.5 shrink-0"></i>
        <span>Hệ thống chỉ cho phép tài khoản Google Workspace chính thức của công ty (<strong>@spxexpress.com</strong>).</span>
      </div>
    </div>

    <!-- Form Đăng Nhập -->
    <form id="loginForm" onsubmit="handleWorkspaceLogin(event)" class="space-y-4">
      <div>
        <label for="emailInput" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
          Email Google Workspace SPX:
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fas fa-envelope text-sm"></i>
          </div>
          <input 
            type="email" 
            id="emailInput" 
            required 
            placeholder="nhan_su@spxexpress.com" 
            value="xuan.nguyenthanh01@spxexpress.com"
            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#ee4d2d] focus:bg-white transition-all shadow-inner"
          >
        </div>
      </div>

      <!-- Quick Roles / Hub Selector (Nếu cần demo/phân quyền nhanh) -->
      <div>
        <label for="roleSelector" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
          Vai trò truy cập:
        </label>
        <select 
          id="roleSelector" 
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 focus:outline-none focus:border-[#ee4d2d] focus:bg-white transition-all cursor-pointer"
        >
          <option value="admin">Quản trị viên Hệ thống (Level 1 - Root Admin)</option>
          <option value="aom">Quản lý Khu vực (Level 2 - AOM Tây Nguyên)</option>
          <option value="sup">Giám sát Cụm Trạm (Level 3 - SUP Đắk Lắk)</option>
          <option value="lead" selected>Trưởng Hub (Level 4 - Lead Krông Pắc 02)</option>
          <option value="staff">Nhân viên Vận hành (Level 5 - Staff Hub)</option>
        </select>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full py-3.5 px-4 spx-gradient text-white rounded-xl font-bold text-sm shadow-lg shadow-orange-500/25 hover:shadow-orange-500/40 hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
      >
        <i class="fab fa-google"></i>
        <span>Đăng nhập với Google Workspace</span>
      </button>

      <!-- Google Official One-Tap Container (tùy chọn) -->
      <div id="g_id_onload"
           data-client_id=""
           data-context="signin"
           data-ux_mode="popup"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
    </form>

    <!-- Error/Status Alert -->
    <div id="alertBox" class="hidden mt-4 p-3 rounded-xl text-xs font-semibold text-center"></div>

    <!-- Quick Accounts Shortcut for Testing -->
    <div class="mt-6 pt-5 border-t border-slate-100">
      <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 text-center mb-3">Tài khoản xác thực nhanh:</p>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" onclick="quickLogin('xuan.nguyenthanh01@spxexpress.com', 'admin')" class="p-2 text-left bg-slate-50 hover:bg-orange-50 rounded-lg border border-slate-200 hover:border-orange-200 transition-all">
          <div class="text-[11px] font-bold text-slate-700 truncate">Admin Xuân</div>
          <div class="text-[10px] text-orange-600 font-semibold">Root Admin (L1)</div>
        </button>
        <button type="button" onclick="quickLogin('lead.krongpak02@spxexpress.com', 'lead')" class="p-2 text-left bg-slate-50 hover:bg-orange-50 rounded-lg border border-slate-200 hover:border-orange-200 transition-all">
          <div class="text-[11px] font-bold text-slate-700 truncate">Lead Krông Pắc 02</div>
          <div class="text-[10px] text-sky-600 font-semibold">Trưởng Hub (L4)</div>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-6 text-center text-[11px] text-slate-400 font-medium">
      SPX Express &bull; Bảo mật thông tin nội bộ &bull; 2026
    </div>
  </div>

  <script>
    function showAlert(msg, isError = true) {
      const box = document.getElementById('alertBox');
      box.className = isError 
        ? 'mt-4 p-3 rounded-xl text-xs font-semibold text-center bg-rose-50 text-rose-600 border border-rose-100'
        : 'mt-4 p-3 rounded-xl text-xs font-semibold text-center bg-emerald-50 text-emerald-600 border border-emerald-100';
      box.innerHTML = (isError ? '<i class="fas fa-circle-exclamation mr-1"></i> ' : '<i class="fas fa-circle-check mr-1"></i> ') + msg;
      box.classList.remove('hidden');
    }

    function quickLogin(email, role) {
      document.getElementById('emailInput').value = email;
      document.getElementById('roleSelector').value = role;
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }

    async function handleWorkspaceLogin(e) {
      if (e) e.preventDefault();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const role = document.getElementById('roleSelector').value;
      const btn = document.getElementById('submitBtn');

      if (!email.endsWith('@spxexpress.com')) {
        showAlert('Chỉ tài khoản Google Workspace nội bộ (@spxexpress.com) mới được phép đăng nhập!', true);
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Đang xác thực...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, role })
        });
        const data = await res.json();

        if (data.success) {
          showAlert('Xác thực thành công! Đang chuyển hướng...', false);
          localStorage.setItem('spx_user_session', JSON.stringify(data.user));
          setTimeout(() => {
            window.location.href = '/';
          }, 600);
        } else {
          showAlert(data.message || 'Xác thực thất bại!', true);
          btn.disabled = false;
          btn.innerHTML = '<i class="fab fa-google"></i><span>Đăng nhập với Google Workspace</span>';
        }
      } catch (err) {
        showAlert('Lỗi kết nối máy chủ: ' + err.message, true);
        btn.disabled = false;
        btn.innerHTML = '<i class="fab fa-google"></i><span>Đăng nhập với Google Workspace</span>';
      }
    }
  </script>
</body>
</html>
